<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fossilis · tres anchos</title>
<style>
  :root{--fondo:#0D0F10;--hueso:#F4EFE4;--bruma:#CFE0E8;--laton:#A97F3C;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--hueso);font:15px/1.5 system-ui,sans-serif;padding:28px 32px 40px}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  h1{font:600 20px/1.2 Georgia,serif;margin:0;letter-spacing:.02em}
  p.nota{margin:0;color:#9FB3BA;font-size:13px}
  .marco{display:flex;gap:26px;align-items:flex-start;overflow-x:auto;padding-bottom:14px}
  figure{margin:0;flex:0 0 auto}
  figcaption{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--laton);margin-bottom:8px}
  .ventana{position:relative;border:1px solid #2A3236;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .ventana iframe{border:0;display:block}
  .m390 .ventana{width:195px;height:422px}
  .m390 iframe{width:390px;height:844px;transform:scale(.5);transform-origin:top left}
  .m768 .ventana{width:384px;height:512px}
  .m768 iframe{width:768px;height:1024px;transform:scale(.5);transform-origin:top left}
  .m1440 .ventana{width:648px;height:405px}
  .m1440 iframe{width:1440px;height:900px;transform:scale(.45);transform-origin:top left}
</style>
</head>
<body>
<header>
  <h1>Fossilis · la misma vitrina en tres anchos</h1>
  <p class="nota">cada marco carga la app a su ancho real · 390 móvil · 768 tableta · 1440 escritorio</p>
</header>
<main class="marco">
  <figure class="m390"><figcaption>390 · móvil</figcaption><div class="ventana"><iframe src="http://127.0.0.1:8123/" title="móvil"></iframe></div></figure>
  <figure class="m768"><figcaption>768 · tableta</figcaption><div class="ventana"><iframe src="http://127.0.0.1:8123/" title="tableta"></iframe></div></figure>
  <figure class="m1440"><figcaption>1440 · escritorio</figcaption><div class="ventana"><iframe src="http://127.0.0.1:8123/" title="escritorio"></iframe></div></figure>
</main>
</body>
</html>
