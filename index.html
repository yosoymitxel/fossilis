<script>
tailwind.config = { theme: { extend: {
  colors: {
    esquisto :'rgb(var(--fondo) / <alpha-value>)',
    sedimento:'rgb(var(--superficie) / <alpha-value>)',
    borde    :'rgb(var(--borde) / <alpha-value>)',

  }

</head>
<body class="min-h-[100svh]">
<div id="root"><div class="carga" data-sala="modular"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" fill="#CFE0E8"><g transform="rotate(-35 12 12)"><rect x="6" y="10.2" width="12" height="3.6" rx="1.8"/><circle cx="6.2" cy="9.4" r="2.6"/><circle cx="6.2" cy="14.6" r="2.6"/><circle cx="17.8" cy="9.4" r="2.6"/><circle cx="17.8" cy="14.6" r="2.6"/></g></svg><b>Fossilis</b><p>Abriendo el gabinete…</p></div></div>
<noscript><div class="carga" data-sala="modular"><b>Fossilis</b><p>Necesitas activar JavaScript para jugar.</p></div></noscript>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
/* Fossilis · cargador secuencial de módulos (sin build).
   Compila cada src/* con Babel y lo ejecuta en orden de dependencias.
   Cada módulo publica su API en FG (FG.data / FG.core / FG.fx / FG.ui). */
(function(){
  var MODULOS = ["src/data/fosiles.js","src/data/cartas.js","src/core/azar.js","src/core/geometria.js","src/core/partida.js","src/core/tablero.js","src/core/economia.js","src/core/eventos.js","src/core/puntuacion.js","src/core/acciones.js","src/core/ia.js","src/fx/entorno.js","src/fx/fx.js","src/fx/audio.js","src/ui/iconos.jsx","src/ui/paleo.jsx","src/ui/atomos.jsx","src/ui/hoja.jsx","src/ui/tablero.jsx","src/ui/cartas.jsx","src/ui/setup.jsx","src/ui/pausa.jsx","src/ui/final.jsx","src/ui/hojas.jsx","src/ui/juego.jsx","src/app.jsx"];
  var OPCIONES = {presets: [[Babel.availablePresets.react, {runtime: "classic"}]], sourceType: "script"};
  function fallo(ruta, e){
    console.error("Fossilis · error cargando " + ruta, e);
    var raiz = document.getElementById("root");
    if (raiz) raiz.textContent = "No se pudo cargar " + ruta + ". Revisa la consola.";
  }
  (async function(){
    window.FG = {data: {}, core: {}, fx: {}, ui: {}};
    var t0 = performance.now();
    for (var i = 0; i < MODULOS.length; i++) {
      var ruta = MODULOS[i];
      try {
        var resp = await fetch(ruta);
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        var codigo = Babel.transform(await resp.text(), OPCIONES).code;
        (0, eval)(codigo);
      } catch (e) { fallo(ruta, e); return; }
    }
    console.info("Fossilis · " + MODULOS.length + " módulos en " + Math.round(performance.now() - t0) + " ms");
  })();
})();
</script>
</body>
</html>
