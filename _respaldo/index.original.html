  const tablero = useRef(null);
  const marcador = useRef(null);
  const lastTurn = useRef(g.turn);
  const lastVP = useRef({});
  const cajas = useRef(new Map());
  const montado = useRef(false);
  const vuelo = useRef(new Map());
  const [banda,setBanda] = useState(null);
  const [vistas,setVistas] = useState([]);
  const col = p.color;
  const suave = SUAVE;

  const enCasilla = (i, k, extra) => {
    const el = tablero.current && tablero.current.querySelector('[data-cell="'+i+'"]');
    chispasEn(el, k, extra);
  };
  const sitio = el => {
    let x=0, y=0, n=el;
    while(n && n!==tablero.current){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; }
    return {x,y};
  };
  useLayoutEffect(()=>{
    const cont = tablero.current; if(!cont) return;
    const vistos = new Set();
    cont.querySelectorAll('[data-tile],[data-peon]').forEach(el=>{
      const k = el.dataset.tile ? 't'+el.dataset.tile : 'p'+el.dataset.peon;
      vistos.add(k);
      const s = sitio(el);
      const ant = cajas.current.get(k);
      cajas.current.set(k, s);
      if(suave || !el.animate) return;
      if(ant){
        const dx = ant.x-s.x, dy = ant.y-s.y;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
        const previa = vuelo.current.get(k); if(previa) previa.cancel();
        const a = el.animate(
          [{transform:'translate('+dx+'px,'+dy+'px)'}, {transform:'translate(0,0)'}],
          {duration:420, easing:'cubic-bezier(.22,1.15,.34,1)', composite:'add'});
        vuelo.current.set(k,a);
        a.finished.then(()=>{ if(vuelo.current.get(k)===a) vuelo.current.delete(k); }, ()=>{});
      } else if(montado.current){
        el.animate([{transform:'scale(.45)',opacity:0},{transform:'scale(1)',opacity:1}],
          {duration:340, easing:'cubic-bezier(.22,1.3,.36,1)', composite:'add'});
      }
    });
    for(const k of [...cajas.current.keys()]) if(!vistos.has(k)){ cajas.current.delete(k); vuelo.current.delete(k); }
    montado.current = true;
  });

  useEffect(()=>{
    if(!g.fx || !tablero.current) return;
    if(g.fx.k==='dig'){
      son(g.fx.caidas.some(c=>c.mat==='stone') ? 'piedra' : 'cavar');
      g.fx.caidas.forEach(c=>{
        enCasilla(c.i, 'cavar', {col:PALETA[MAT_PAL[c.mat]] || PALETA.caida});
        Sacudida(tablero.current, c.mat==='stone' ? 7 : c.mat==='clay' ? 4 : 2);
        const el = tablero.current.querySelector('[data-cell="'+c.i+'"]');
        flotanteEn(el, '+ '+MAT[c.mat].es, PALETA[MAT_PAL[c.mat]][0]);
      });
    }
    if(g.fx.k==='extract'){
      const el = tablero.current.querySelector('[data-cell="'+g.fx.cell+'"] .capa');
      const casilla = tablero.current.querySelector('[data-cell="'+g.fx.cell+'"]');
      if(el && el.animate && !suave)
        el.animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],
          {duration:460, easing:'cubic-bezier(.3,1.4,.4,1)'});
      if(g.fx.item==='martillo'){
        son('martillo');
        enCasilla(g.fx.cell, 'martillo');
        flotanteEn(casilla, 'Martillo', PALETA.martillo[0]);
      } else {
        const v = BONE[g.fx.item].val, raro = v>=6;
        son(raro ? 'raro' : 'extraer');
        enCasilla(g.fx.cell, 'extraer', {n: 16 + v*3, vel: 3.4 + v*0.22});
        flotanteEn(casilla, BONE[g.fx.item].es+' '+v, PALETA.hueso[raro?2:0], raro);
        if(raro) Destello(tablero.current, PALETA.hueso[2]);
      }
    }
  },[g.fxId]);

  useEffect(()=>{
    if(g.turn===lastTurn.current) return;
    lastTurn.current = g.turn;
    son('turno');
    setBanda({texto:'Turno de '+cur(g).name, color:cur(g).color, id:Date.now()});
    const t = setTimeout(()=>setBanda(null), 1700);
    return ()=>clearTimeout(t);
  },[g.turn]);

  useEffect(()=>{
    g.players.forEach(q=>{
      const antes = lastVP.current[q.id];
      const d = antes===undefined ? 0 : q.vp-antes;
      if(d>0){
        if(q.id===g.turn || d>=8)
          flotanteEn(marcador.current, '+'+d+' PV', q.color, d>=8);
        if(d>=12){
          const ult = q.scored[q.scored.length-1];
          const cE = ult ? ERA_COL[eraDe(ult)] : '#FFD23F';
          const pal = [cE,'#FFF3D6','#FFD23F'];
          son('esqueleto');
          Chispas(window.innerWidth/2, window.innerHeight*0.40,
            Object.assign({}, PERFIL.esqueleto, {col:pal.concat(q.color)}));
          Destello(tablero.current, cE);
          setBanda({texto: ult ? ult.name+' al museo' : 'Esqueleto completo',
                    color: cE, id: Date.now()});
        }
      }
      lastVP.current[q.id]=q.vp;
    });
  },[g]);

  const SON_ACC = {move:'mover', sand:'arena', climb:'subir', plaster:'yeso',
                   buy:'compra', skillPlaster:'yeso', skillPush:'mover'};
  const run = (t, pl={}) => {
    if(SON_ACC[t]) son(SON_ACC[t]);
    setG(x=>act(x,t,pl)); setSel(null); setHoja(null);
  };

  useEffect(()=>{
    if(g.log.length>lastLog.current){
      const t = g.log[g.log.length-1].t;
      lastLog.current = g.log.length;
      if(!t.startsWith('—')) setToast({t, id:g.log.length});
    }
    const id = g.lastEvent ? g.lastEvent.id : 0;
    if(id>lastEvt.current){
      lastEvt.current = id; setEvt(g.lastEvent);
      Chispas(window.innerWidth/2, window.innerHeight*0.24, PERFIL.evento);
      son('evento');
      Destello(tablero.current, PALETA.evento[0]);
      Sacudida(tablero.current, 6);
    }
  },[g]);
  useEffect(()=>{ if(!toast) return; const i=setTimeout(()=>setToast(null),2400); return ()=>clearTimeout(i); },[toast]);

  useEffect(()=>{
    if(g.over || !cur(g).isAI) { guard.current=0; return; }
    const id = setTimeout(()=>{
      guard.current++;
      const s = guard.current>70 ? {t:'endTurn'} : aiStep(g);
      setG(x=>act(x, s.t, s));
      if(s.t==='endTurn') guard.current=0;
    }, 430);
    return ()=>clearTimeout(id);
  }, [g]);

  if(g.over) return <Final g={g} onRestart={onRestart}/>;

  const canAfford = c => !!solvePayment(p.tiles, c.cost);
  const digs  = digTargets(g,p).filter(i=>digCost(p, g.cells[i][g.cells[i].length-1].mat) <= g.energy);
  const exts  = extractTargets(g,p);
  const mvs   = moveTargets(g,p);
  const sands = sandTargets(g,p);
  const climbs= climbTargets(g,p);
  const tool  = sel && sel.m==='tool' ? p.tools[sel.ti].card : null;
  const hum   = !p.isAI;
  const pista = hum ? PISTAS.find(x=>vistas.indexOf(x.k)<0 && x.cond(g,p)) : null;

  let hi = new Set();
  if(sel && hum){
    if(sel.m==='move') hi = new Set(mvs);
    if(sel.m==='climb') hi = new Set(climbs);
    if(sel.m==='sand') hi = new Set(sands);
    if(sel.m==='extract') hi = new Set(exts);
    if(sel.m==='dig') hi = new Set(sel.from!==undefined?[sel.from]:digs);
    if(sel.m==='tool'){
      const e = tool.eff;
      if(e.t==='slide') hi = new Set(sel.from!==undefined?[sel.from]:[...Array(25).keys()].filter(i=>g.cells[i].length&&g.cells[i][g.cells[i].length-1].mat===e.mat));
      if(e.t==='remove') hi = new Set([...Array(25).keys()].filter(i=>g.cells[i].length&&g.cells[i][g.cells[i].length-1].mat===e.mat));
      if(e.t==='removeTop') hi = new Set([...Array(25).keys()].filter(i=>g.cells[i].length>0));
      if(e.t==='move') hi = new Set(reach(g,p,e.n));
      if(e.t==='lantern' && sel.step==='cell') hi = new Set([...Array(25).keys()].filter(i=>g.cells[i].length<2));
    }
  }
  const arrowsFor = from => Object.fromEntries(Object.keys(DIRS).map(d=>[d, planDig(g,from,d).ok]));

  useEffect(()=>{
    const k = e => {
      if(e.key==='Escape' && sel) return setSel(null);
      if(!sel || sel.m!=='dig' || sel.from===undefined) return;
      const d = {ArrowUp:'N', ArrowDown:'S', ArrowLeft:'O', ArrowRight:'E'}[e.key];
      if(d && planDig(g, sel.from, d).ok){ e.preventDefault(); run('dig',{from:sel.from, dir:d}); }
    };
    window.addEventListener('keydown',k);
    return ()=>window.removeEventListener('keydown',k);
  },[sel,g]);

  const onCell = i => {
    if(!hum || !sel) return;
    if(sel.m==='move' && hi.has(i)) return run('move',{to:i});
    if(sel.m==='climb' && hi.has(i)) return run('climb',{to:i});
    if(sel.m==='sand' && hi.has(i)) return run('sand',{to:i});
    if(sel.m==='extract' && hi.has(i)) return setHoja({k:'pit', cell:i});
    if(sel.m==='dig'){
      if(sel.from===i) return setSel({m:'dig'});
      if(sel.from!==undefined){
        const d = pasoHacia(sel.from, i);
        if(d && planDig(g, sel.from, d).ok) return run('dig',{from:sel.from, dir:d});
      }
      if(digs.includes(i)) return setSel({m:'dig', from:i});
    }
    if(sel.m==='tool'){
      const e = tool.eff;
      if(e.t==='move' && hi.has(i)) return run('tool',{toolIndex:sel.ti, to:i});
      if((e.t==='remove'||e.t==='removeTop') && hi.has(i)) return run('tool',{toolIndex:sel.ti, from:i});
      if(e.t==='slide'){ if(sel.from===i) return setSel({...sel, from:undefined}); if(hi.has(i)) return setSel({...sel, from:i}); }
      if(e.t==='lantern' && sel.step==='cell' && hi.has(i)){
        const last = sel.left<=1;
        setG(x=>act(x,'tool',{toolIndex:sel.ti, tileId:sel.tileId, to:i, last}));
        return last ? setSel(null) : setSel({m:'tool', ti:sel.ti, step:'tile', left:sel.left-1});
      }
    }
  };

  const A = ({k, t, on, dis, cost, active}) => {
    const ico = useRef(null);
    const gesto = () => {
      if(!ico.current || !ico.current.animate || dis || suave) return;
      ico.current.animate((GESTO[k] || GESTO.pausa).map(tr=>({transform:tr})),
        {duration:520, easing:'cubic-bezier(.3,.9,.3,1)'});
    };
    const pulsar = e => {
      gesto();
      chispasEn(e.currentTarget, k, (k==='mover'||k==='subir') ? {col:[col,'#FFFFFF']} : null);
      if(k==='yeso') flotanteEn(e.currentTarget, '+1 yeso', PALETA.yeso[2]);
      on();
    };
    return (
      <button onClick={pulsar} onMouseEnter={gesto} onFocus={gesto} disabled={dis}
        className="btn-fisico flex flex-col items-center justify-center gap-0.5 py-2 lg:py-2.5 rounded-xl text-[11px] lg:text-[12px] font-medium leading-tight transition-[transform,color,background-color,border-color,opacity,filter,box-shadow] active:scale-95 disabled:opacity-25 disabled:active:scale-100 bg-sedimento border hover:brightness-110 min-h-[62px] lg:min-h-[68px]"
        style={active ? {background:col, color:'#0C1112', borderColor:col} : {borderColor:'#2C3A3D'}}>
        <span ref={ico} className="block">{k==='yeso' ? <Yeso s={18}/> : <Ico k={k} s={18}/>}</span>
        <span className="leading-none">{t}</span>
        <span className={'leading-none text-[10px] inline-flex items-center '+(active?'opacity-75':'text-tenue')}>{cost===0?'gratis':<>{cost}<Rayo s={9}/></>}</span>
      </button>
    );
  };

  const TabBtn = ({id, label, badge, icon, full}) => {
    const iconEl = icon
      ? (ICONO[icon] ? <Ic k={icon} s={16}/> : <Ico k={icon} s={16}/>)
      : null;
    return (
      <button onClick={()=>setHoja(id)} aria-label={label} title={label}
        className={'relative flex flex-col items-center justify-center gap-1 py-1.5 min-h-[44px] px-1.5 text-[11px] text-tenue hover:text-hueso transition-colors rounded-lg hover:bg-borde/30 '+(full?'flex-1':'w-full')}>
        {iconEl}
        <span className="truncate leading-none">{label}</span>
        {badge>0 && <span className="absolute top-0.5 right-0.5 min-w-[15px] h-[15px] px-1 rounded-full text-[9px] font-bold leading-[15px]"
          style={{background:col, color:'#0C1112'}}>{badge}</span>}
      </button>
    );
  };

  const puedePuntuar = g.dinoRow.filter(d=>{ if(!d) return false; const n={}; d.bones.forEach(b=>n[b]=(n[b]||0)+1);
    return Object.entries(n).every(([b,k])=>p.storage[b]>=k); }).length
    + p.lab.filter(d=>d.assigned.length===d.bones.length).length;

  const avisos = (
    <>
      {g.players.some(q=>q.pos===null) && (
        <div className="flex flex-wrap items-center gap-2 rounded-xl border border-arcilla/50 bg-arcilla/10 px-2.5 py-2">
          <span className="text-[11px] text-arcilla shrink-0">Fuera del yacimiento</span>
          {g.players.filter(q=>q.pos===null).map(q=>(
            <span key={q.id} className="flex items-center gap-1.5 text-[11px]">
              <Peon color={q.color} letra={q.name[0].toUpperCase()} s={20} activo={q.id===g.turn}/>
              <span className="text-hueso/85">{q.name}</span>
              <span className="text-tenue">lado {({N:'norte',S:'sur',E:'este',O:'oeste'})[q.fell]}</span>
            </span>))}
          {hum && p.pos===null && <BtnJ col={col} cls="ml-auto !py-1.5 !px-3 text-[12px]"
            dis={g.energy<1||!climbs.length} on={()=>setSel({m:'climb'})}>Volver al tajo · 1<Rayo s={10}/></BtnJ>}
        </div>)}
      {hum && pista && (
        <div className="flex items-start gap-2.5 rounded-xl p-2.5"
          style={{border:'1px solid '+col+'55', background:col+'10'}}>
          <span className="mt-0.5 shrink-0" style={{color:col}}><Ico k="pista" s={17}/></span>
          <p className="text-[12px] leading-snug flex-1 text-hueso/90">{pista.t}</p>
          <button onClick={()=>setVistas(v=>[...v, pista.k])}
            className="shrink-0 text-[11px] px-2 py-1 rounded-lg font-medium"
            style={{background:col, color:'#0C1112'}}>Vale</button>
        </div>)}
    </>
  );

  const acciones = hum && g.phase==='actions' && (
    <>
      <div className="grid grid-cols-4 lg:grid-cols-2 gap-1.5 lg:gap-2">
        <A k="yeso" t="Yeso" cost={1} dis={g.energy<1||(g.pool===0&&g.reserve===0)} on={()=>run('plaster')}/>
        <A k="mover" t="Mover" cost={1} dis={g.energy<1||!mvs.length} active={sel&&sel.m==='move'} on={()=>setSel(sel&&sel.m==='move'?null:{m:'move'})}/>
        <A k="cavar" t="Cavar" cost={1} dis={!digs.length} active={sel&&sel.m==='dig'} on={()=>setSel(sel&&sel.m==='dig'?null:{m:'dig'})}/>
        <A k="extraer" t="Extraer" cost={1} dis={g.energy<1||!exts.length} active={sel&&sel.m==='extract'} on={()=>setSel(sel&&sel.m==='extract'?null:{m:'extract'})}/>
        <A k="arena" t="Arena" cost={has(p,'arenaFree')?0:1} dis={!sands.length||g.energy<(has(p,'arenaFree')?0:1)} active={sel&&sel.m==='sand'} on={()=>setSel(sel&&sel.m==='sand'?null:{m:'sand'})}/>
        {p.pos===null && <A k="subir" t="Subir" cost={1} dis={g.energy<1||!climbs.length} active={sel&&sel.m==='climb'} on={()=>setSel({m:'climb'})}/>}
        {has(p,'yeso2') && <A k="yeso" t="Mezcla" cost={1} dis={g.energy<1||g.usedSkill.yeso2} on={()=>run('skillPlaster')}/>}
      </div>
      <BtnJ col={col} cls="mt-2 w-full" on={()=>run('phase',{to:'market'})}>
        <Ico k="mercado" s={16}/> Pasar al mercado
      </BtnJ>
    </>
  );
  const faseMercado = hum && g.phase==='market' && (
    <div className="flex gap-2">
      <Btn cls="flex-1 py-3" on={()=>setHoja('mercado')}><Ico k="mercado" s={16}/> Ver el mercado</Btn>
      <BtnJ col={col} cls="flex-1" on={()=>run('phase',{to:'lab'})}>
        <Ico k="turno" s={15}/> {g.bought?'Seguir':'No comprar'}
      </BtnJ>
    </div>
  );
  const faseLab = hum && g.phase==='lab' && (
    <div className="flex gap-2">
      <Btn cls="flex-1 py-3" on={()=>setHoja('dinos')}><IcoDino s={17}/> Ver dinosaurios</Btn>
      <BtnJ col={col} cls="flex-1" on={()=>run('endTurn')}>
        <Ico k="turno" s={15}/> Terminar turno
      </BtnJ>
    </div>
  );

  return (
    <div className="min-h-[100svh] lg:h-[100svh] lg:overflow-hidden flex flex-col pb-20 lg:pb-0">
      <TEX/>
      <header className="shrink-0 z-30"
        style={{background:'rgba(18,25,27,.95)', borderBottom:'2px solid '+col,
                boxShadow:'0 4px 0 rgba(0,0,0,.35), 0 12px 22px -10px rgba(0,0,0,.7)'}}>
        <div className="max-w-[1200px] mx-auto px-3 lg:px-5 py-2">
          <div className="flex items-center gap-2.5">
            <Peon color={p.color} letra={p.name[0].toUpperCase()} s={30} activo/>
            <div className="min-w-0 flex-1">
              <div className="disp font-bold text-[14px] leading-none truncate">{p.name}
                {p.isAI && <span className="text-tenue font-normal text-[12px]"> · excavando</span>}</div>
              <div className="text-[12px] text-tenue leading-none mt-1">
                {g.phase==='actions'?'acciones':g.phase==='market'?'mercado':'laboratorio'}
                {g.remaining!==undefined && ' · quedan '+g.remaining+' turnos'}</div>
            </div>
            <div className="flex gap-[3px] items-center" title={'Energía: '+g.energy}>
              {g.energy===0 && g.phase==='actions'
                ? <span className="text-[10px] text-arcilla font-medium px-1.5 py-0.5 rounded bg-arcilla/15 border border-arcilla/40">sin energía</span>
                : <>
                  {Array.from({length:Math.max(g.energy,0)},(_,k)=><span key={k} className="w-[7px] h-4 rounded-sm"
                    style={{background:col, boxShadow:'inset 0 1px 0 rgba(255,255,255,.4), 0 2px 0 rgba(0,0,0,.4)'}}/>)}
                  {Array.from({length:Math.max(startEnergy(p)-g.energy,0)},(_,k)=><span key={k} className="w-[7px] h-4 rounded-sm bg-borde"/>)}
                </>}
            </div>
            <div ref={marcador} className="text-right shrink-0 w-10">
              <div className="disp font-extrabold text-lg leading-none" style={{color:col}}>{p.vp}</div>
              <div className="text-[10px] text-tenue leading-none">PV</div>
            </div>
          </div>
          <div className="flex items-center gap-2 mt-2">
            <span className="text-[11px] text-tenue shrink-0">Depósito {g.poolIndex}/4</span>
            <div className="flex gap-[2px] flex-1 h-2.5 items-stretch">
              {Array.from({length:Math.max(g.pool,0)},(_,k)=><span key={k} className="flex-1 max-w-[10px] bg-hueso rounded-[2px]"
                style={{boxShadow:'inset 0 1px 0 rgba(255,255,255,.5), 0 1px 0 rgba(0,0,0,.4)'}}/>)}
              {g.pool===0 && <span className="text-[11px] text-arcilla self-center">vacío · evento inminente</span>}
              {g.pool>0 && g.pool<=2 && <span className="text-[11px] text-cinta self-center">quedan {g.pool}</span>}
            </div>
            <span className="text-[11px] text-tenue shrink-0 flex items-center gap-1"><Yeso s={12}/><b className="text-hueso">{p.plaster}</b></span>
          </div>
        </div>
      </header>

      <div className="lg:flex-1 lg:min-h-0 lg:overflow-hidden">
        <div className="h-full max-w-[1200px] mx-auto px-3 lg:px-5 lg:grid lg:grid-cols-[minmax(0,1fr)_368px] lg:gap-6 lg:pt-3 lg:items-start">
          <main className="min-w-0 lg:min-h-0">
            <div ref={tablero} className="escena relative mt-3 lg:mt-0 p-2 lg:p-3 rounded-2xl transition-colors lg:max-w-[calc(100svh-260px)] lg:mx-auto lg:w-full"
              style={{background:'radial-gradient(ellipse at 50% 20%, #12191B 0%, #0A1011 70%)'}}>
              <div className="marco-yacimiento">
                <div className="rejilla-3d grid grid-cols-5 gap-1.5 lg:gap-2.5 select-none relative">
                  {[...Array(25).keys()].map(i=>
                    <Cell key={i} g={g} i={i} hi={hi.has(i)} col={col}
                      dim={!!sel && hum && hi.size>0 && !hi.has(i)}
                      onClick={sel && hum ? ()=>onCell(i) : undefined}
                      arrows={sel && (sel.m==='dig'||(sel.m==='tool'&&tool&&tool.eff.t==='slide')) && sel.from===i ? arrowsFor(i) : null}
                      onArrow={d=> sel.m==='dig' ? run('dig',{from:i, dir:d}) : run('tool',{toolIndex:sel.ti, from:i, dir:d})}/>)}
                </div>
              </div>
            </div>

            <p className="mt-2.5 lg:mt-3 text-[13px] text-hueso/80 min-h-[18px] lg:max-w-[calc(100svh-260px)] lg:mx-auto lg:w-full">
              {sel && sel.m==='dig' && (sel.from===undefined ? 'Elige la loseta que vas a empujar.' : 'Elige hacia dónde la empujas.')}
              {sel && sel.m==='move' && 'Elige dónde plantarte.'}
              {sel && sel.m==='extract' && 'Elige una fosa abierta a tu lado.'}
              {sel && sel.m==='sand' && 'Elige dónde poner la arena.'}
              {sel && sel.m==='climb' && 'Vuelves por el lado por el que caíste.'}
              {sel && sel.m==='tool' && (tool.eff.t==='lantern' && sel.step==='tile' ? 'Elige una loseta del descarte.' : 'Usando '+tool.n+'.')}
              {!sel && hum && g.phase==='actions' && (g.energy>0 ? 'Te quedan '+g.energy+' de energía.' : 'Sin energía. Pasa al mercado.')}
              {!sel && hum && g.phase==='market' && ('Puedes comprar '+(marketCap(p)>1?'hasta '+marketCap(p)+' cartas':'una carta')+' con tus fragmentos.')}
              {!sel && hum && g.phase==='lab' && 'Puedes llevarte un dinosaurio al laboratorio.'}
              {p.isAI && 'El bot está resolviendo su turno.'}
            </p>

            <div className="hidden lg:block mt-2 space-y-2 min-h-[60px] lg:max-w-[calc(100svh-260px)] lg:mx-auto lg:w-full">{avisos}</div>
          </main>

          <aside className="lg:h-full lg:overflow-y-auto lg:min-h-0 lg:pr-1 mt-3 lg:mt-0">
            <div className="hidden lg:flex gap-0.5 mb-3 rounded-xl border border-borde/70 bg-sedimento/40 p-1">
              <TabBtn id="dinos" label="Dinos" badge={puedePuntuar} icon="teropodo"/>
              <TabBtn id="mercado" label="Mercado" icon="mercado"/>
              <TabBtn id="equipo" label="Equipo" badge={p.tools.filter(t=>!t.used).length} icon="equipo"/>
              <TabBtn id="marcador" label="Marcador" icon="marcador"/>
              <TabBtn id="pausa" label="Pausa" icon="pausa"/>
            </div>

            {acciones}
            {faseMercado}
            {faseLab}

            <div className="lg:hidden mt-3 space-y-2 min-h-[60px]">{avisos}</div>

            <div className="hidden lg:block mt-3 rounded-xl border border-borde/70 bg-sedimento/40 p-3">
              <h4 className="text-[11px] text-tenue mb-1.5 uppercase tracking-wider">Registro</h4>
              <div className="space-y-1 max-h-[180px] overflow-y-auto scroll">
                {g.log.slice(-8).reverse().map((l,i)=>(
                  <p key={i} className={'text-[12px] leading-snug '+(l.t.startsWith('EVENTO')?'text-arcilla':l.t.startsWith('—')?'text-cinta':'text-tenue')}>{l.t}</p>
                ))}
              </div>
            </div>
          </aside>
        </div>
      </div>

      <nav className="lg:hidden fixed bottom-0 inset-x-0 z-30 flex bg-sedimento/98"
        style={{paddingBottom:'env(safe-area-inset-bottom)', boxShadow:'0 -4px 0 rgba(0,0,0,.3), 0 -12px 22px -10px rgba(0,0,0,.7)'}}>
        <TabBtn id="dinos" label="Dinosaurios" badge={puedePuntuar} full/>
        <TabBtn id="mercado" label="Mercado" full/>
        <TabBtn id="equipo" label="Tu equipo" badge={p.tools.filter(t=>!t.used).length} full/>
        <TabBtn id="marcador" label="Marcador" full/>
        <TabBtn id="pausa" label="Pausa" icon="pausa" full/>
      </nav>

      {banda && <Banda key={banda.id} banda={banda}/>}

      {toast && <div key={toast.id} role="status" aria-live="polite" className="flota fixed left-1/2 -translate-x-1/2 bottom-20 z-40 max-w-[90vw] px-3.5 py-2 rounded-full bg-hueso text-esquisto text-[12px] font-medium"
        style={{boxShadow:'0 4px 0 rgba(0,0,0,.4), 0 12px 20px -8px rgba(0,0,0,.7)'}}>{toast.t}</div>}

      {evt && <Hoja title={evt.n} sub="Evento" col="#A8432E" onClose={()=>setEvt(null)}>
        <div className="flex gap-3 items-start">
          <div className="w-11 h-11 rounded-lg bg-arcilla/25 text-arcilla flex items-center justify-center shrink-0 disp font-extrabold text-xl">!</div>
          <p className="text-[13px] leading-relaxed text-hueso/90">{evt.d}</p>
        </div>
        {evt.efectos && evt.efectos.length>0 &&
          <div className="mt-3 rounded-xl border border-borde bg-esquisto/60 p-3">
            <p className="text-[10px] text-cinta mb-1.5">A quién afecta</p>
            {evt.efectos.map((t,i)=><p key={i} className="text-[13px] leading-snug text-hueso">{t}</p>)}
          </div>}
        <BtnJ col={col} cls="mt-4 w-full" on={()=>setEvt(null)}>Entendido</BtnJ>
      </Hoja>}

      <Hojas g={g} p={p} col={col} onRestart={onRestart} hoja={hoja} setHoja={setHoja} run={run} sel={sel} setSel={setSel} canAfford={canAfford}/>
    </div>
  );
}

function Hojas({g,p,col,onRestart,hoja,setHoja,run,sel,setSel,canAfford}){
  const [ham,setHam] = useState(null);
  const [claim,setClaim] = useState(null);
  const cerrar = () => { setHam(null); setClaim(null); setHoja(null); };
  if(!hoja) return null;
  const hum = !p.isAI;

  if(hoja.k==='pit'){
    const items = g.pits[hoja.cell];
    if(ham!==null) return (
      <Hoja title="Elige una habilidad" sub="Devuelves el martillo y te enseñan un truco" col={col} onClose={cerrar}>
        <div className="grid gap-2">
          {g.skillRow.map((s,i)=>
            <button key={s.k} onClick={e=>{chispasEn(e.currentTarget,'habilidad'); flotanteEn(e.currentTarget, s.n, PALETA.habilidad[0]); setHam(null); run('extract',{cell:hoja.cell, item:'martillo', skillIndex:i});}}
              className="carta-fisica text-left rounded-xl p-3 hover:border-cinta transition-colors active:scale-[.99] border border-borde">
              <div className="disp font-bold text-[14px] flex items-center gap-1.5">{s.n}{s.agg && <span className="text-arcilla" title="Habilidad de enfrentamiento"><AvisoIco s={12}/></span>}</div>
              <div className="text-[11px] text-tenue leading-snug mt-0.5">{s.d}</div>
            </button>)}
        </div>
        <p className="text-[11px] text-tenue mt-3">Ocupas la ranura {p.skills.length+1}. Si la dejabas vacía valía {SKILL_SLOT_VP[p.skills.length]} PV.</p>
      </Hoja>);
    const uniq = [...new Set(items)];
    return (
      <Hoja title="Fosa abierta" sub={'Tienes '+p.plaster+' de yeso'} col={col} onClose={cerrar}>
        <div className="grid gap-2">
          {uniq.map(o=>{
            if(o==='martillo'){
              const cap = has(p,'martillo2')?2:1, dis = g.hammers>=cap || !g.skillRow.length;
              return <button key={o} disabled={dis} onClick={()=>setHam(0)}
                className="flex items-center gap-3 rounded-xl border border-borde p-3 disabled:opacity-30 hover:border-cinta transition-colors">
                <span className="w-9 h-9 rounded-lg bg-piedra/25 text-piedra flex items-center justify-center shrink-0"><Hammer s={20}/></span>
                <span className="flex-1 text-left"><span className="disp font-bold text-[14px] block">Martillo</span>
                  <span className="text-[11px] text-tenue">{dis?'ya cogiste uno este turno':'lo cambias por una habilidad'}</span></span>
                <span className="text-[12px] text-cinta shrink-0">0 yeso</span></button>;
            }
            const c = bonePlaster(p,o), dis = p.plaster<c, n = items.filter(x=>x===o).length;
            return <button key={o} disabled={dis} onClick={()=>run('extract',{cell:hoja.cell, item:o})}
              className="flex items-center gap-3 rounded-xl border border-borde p-3 disabled:opacity-30 hover:border-cinta transition-colors">
              <span className="w-9 h-9 rounded-lg bg-hueso/10 text-hueso flex items-center justify-center shrink-0"><Bone t={o} s={21}/></span>
              <span className="flex-1 text-left"><span className="disp font-bold text-[14px] block">{BONE[o].es}{n>1 && <span className="text-tenue font-normal"> ×{n}</span>}</span>
                <span className="text-[11px] text-tenue">{BONE[o].end} PV si te lo quedas</span></span>
              <span className={'text-[12px] shrink-0 '+(dis?'text-arcilla':'text-cinta')}>{c} yeso{c>1?'s':''}</span></button>;
          })}
        </div>
      </Hoja>);
  }

  if(hoja==='dinos'){
    const puedeYa = d => { if(!d) return false; const n={}; d.bones.forEach(b=>n[b]=(n[b]||0)+1);
      return Object.entries(n).every(([b,k])=>p.storage[b]>=k); };
    return (
      <Hoja title="Dinosaurios" sub="Laboratorio y expositor" col={col} onClose={cerrar} wide>
        {p.lab.map((d,i)=>{
          const need = d.bones.slice(); d.assigned.forEach(x=>{const k=need.indexOf(x); if(k>=0)need.splice(k,1);});
          const perfecto = need.length===0, parcial = d.assigned.reduce((a,x)=>a+BONE[x].val,0);
          return (
            <div key={i} className="mb-3">
              <p className="text-[11px] text-cinta mb-1">En tu laboratorio</p>
              <DinoCard d={d} compact>
                {[...new Set(need)].filter(b=>p.storage[b]>0).length>0 &&
                  <div className="flex flex-wrap justify-center gap-1.5">
                    {[...new Set(need)].filter(b=>p.storage[b]>0).map(b=>
                      <Btn key={b} on={()=>run('assign',{labIndex:i, bone:b})}>Montar {BONE[b].es.toLowerCase()}</Btn>)}
                  </div>}
                {perfecto
                  ? <BtnEra color={ERA_COL[eraDe(d)]} dis={!hum} on={()=>run('scoreLab',{labIndex:i})}>Donar al museo · {d.perfect} PV</BtnEra>
                  : <BtnEraSec color={ERA_COL[eraDe(d)]} dis={!hum||!d.assigned.length} on={()=>run('scoreLab',{labIndex:i})}>Donar incompleto · {parcial} PV</BtnEraSec>}
              </DinoCard>
            </div>);
        })}
        <p className="text-[11px] text-tenue mb-1.5 mt-1">Expositor</p>
        <div className="grid gap-2.5 sm:grid-cols-2">
          {g.dinoRow.map((d,i)=>(
            <DinoCard key={i} d={d}>
              {d && <>
                {puedeYa(d) && hum &&
                  <BtnEra color={ERA_COL[eraDe(d)]} on={()=>run('scoreRow',{rowIndex:i})}>Esqueleto completo · {d.perfect} PV</BtnEra>}
                {hum && g.phase==='lab' && p.lab.length<labCap(p) && d.bones.some(b=>p.storage[b]>0) && (
                  claim===i
                    ? <div className="flex flex-wrap justify-center gap-1.5">
                        {[...new Set(d.bones)].filter(b=>p.storage[b]>0).map(b=>
                          <Btn key={b} tone="p" on={()=>{setClaim(null); run('claim',{rowIndex:i, bone:b});}}>Con {BONE[b].es.toLowerCase()}</Btn>)}
                      </div>
                    : <BtnEraSec color={ERA_COL[eraDe(d)]} on={()=>setClaim(i)}>Llevar al laboratorio</BtnEraSec>)}
                {g.phase!=='lab' && !puedeYa(d) &&
                  <p className="text-[11px] text-tenue">Se reclama en el paso de laboratorio.</p>}
              </>}
            </DinoCard>))}
        </div>
      </Hoja>);
  }

  if(hoja==='mercado') return (
    <Hoja title="Mercado" sub={g.bought>=marketCap(p) ? 'Ya has comprado este turno' : (marketCap(p)>1?'Puedes comprar hasta '+marketCap(p)+' cartas':'Una carta por turno')} col={col} onClose={cerrar}>
      <div className="grid gap-2.5">
        {g.market.map((c,i)=><MarketCard key={i} c={c}
          canBuy={hum && g.phase!=='lab' && g.bought<marketCap(p) && c.k!=='vacio' && canAfford(c)}
          on={()=>run('buy',{marketIndex:i})}/>)}
      </div>
      <div className="mt-4 rounded-xl border border-borde p-3">
        <h4 className="disp font-bold text-[13px] mb-2">Tus losetas</h4>
        {p.tiles.length===0
          ? <p className="text-[12px] text-tenue">Todavía no has tirado ninguna loseta fuera del yacimiento. Empuja hacia el borde para reclamarlas.</p>
          : <div className="flex flex-wrap gap-1.5">{p.tiles.map(t=>
              <span key={t.id} className="relative tile h1 px-2.5 py-1.5" style={{background:MAT[t.mat].bg,color:MAT[t.mat].fg}}>
                <svg className="absolute inset-0 w-full h-full"><rect width="100%" height="100%" fill={TEX_URL[t.mat]}/>
                  <rect width="100%" height="100%" fill="url(#grBrillo)"/></svg>
                <span className="relative"><Frags t={t} s={13}/></span></span>)}</div>}
      </div>
    </Hoja>);

  if(hoja==='equipo'){
    if(sel && sel.m==='tool' && sel.step==='tile') return (
      <Hoja title="Linterna" sub={'Te quedan '+sel.left+' losetas por devolver'} col={col} onClose={cerrar}>
        <div className="flex flex-wrap gap-2">
          {g.discard.map(t=>
            <button key={t.id} onClick={()=>{setHoja(null); setSel({...sel, step:'cell', tileId:t.id});}}
              className="relative tile h1 px-3 py-2" style={{background:MAT[t.mat].bg,color:MAT[t.mat].fg}}>
              <svg className="absolute inset-0 w-full h-full"><rect width="100%" height="100%" fill={TEX_URL[t.mat]}/>
                <rect width="100%" height="100%" fill="url(#grBrillo)"/></svg>
              <span className="relative"><Frags t={t} s={13}/></span></button>)}
        </div>
      </Hoja>);
    return (
      <Hoja title="Tu equipo" sub={p.name} col={col} onClose={cerrar}>
        <h4 className="disp font-bold text-[13px] mb-2">Almacén</h4>
        <div className="grid grid-cols-5 gap-1.5">
          {Object.keys(BONE).map(b=>
            <div key={b} className={'rounded-lg border p-2 text-center '+(p.storage[b]?'border-hueso/35 text-hueso':'border-borde text-tenue')}
              style={p.storage[b]?{background:'linear-gradient(180deg, rgba(239,230,210,.06), transparent)'}:undefined}>
              <Bone t={b} s={20}/>
              <div className="disp font-extrabold text-[15px] leading-none mt-1">{p.storage[b]}</div>
              <div className="text-[9px] leading-none mt-0.5 opacity-70">{BONE[b].es}</div>
            </div>)}
        </div>
        <p className="text-[11px] text-tenue mt-2 flex items-center gap-1.5"><Yeso s={13}/> {p.plaster} de yeso · valen {Math.floor(p.plaster/2)} PV al final</p>

        <h4 className="disp font-bold text-[13px] mt-4 mb-2">Herramientas</h4>
        {p.tools.length===0
          ? <p className="text-[12px] text-tenue">Ninguna. Se compran en el mercado con fragmentos y no gastan energía al usarlas.</p>
          : <div className="grid gap-2">{p.tools.map((s,i)=>(
              <div key={i} className={'carta-fisica flex items-center gap-3 rounded-xl p-3 '+(s.used?'opacity-45':'')}
                style={{border:'1px solid '+(s.used?'#2C3A3D':'#EFE6D255')}}>
                <span className="w-9 h-9 rounded-lg bg-piedra/25 text-piedra flex items-center justify-center shrink-0"><Hammer s={19}/></span>
                <div className="min-w-0 flex-1">
                  <div className="disp font-bold text-[14px]">{s.card.n} {s.card.vp>0 && <span className="text-tenue font-normal text-[11px]">{s.card.vp} PV</span>}</div>
                  <div className="text-[11px] text-tenue leading-snug">{s.card.d}</div>
                </div>
                <Btn dis={s.used||!hum||g.phase!=='actions'} tone="p"
                  on={()=>{ const e=s.card.eff;
                    if(e.t==='energy') return run('tool',{toolIndex:i});
                    if(e.t==='lantern') return setSel({m:'tool', ti:i, step:'tile', left:e.n});
                    setSel({m:'tool', ti:i}); setHoja(null); }}>{s.used?'Usada':'Usar'}</Btn>
              </div>))}</div>}

        <h4 className="disp font-bold text-[13px] mt-4 mb-2">Habilidades</h4>
        <div className="grid gap-2">
          {[0,1,2].map(i=> p.skills[i]
            ? <div key={i} className="carta-fisica rounded-xl p-3" style={{border:'1px solid #EFE6D255'}}>
                <div className="disp font-bold text-[14px]">{p.skills[i].n}</div>
                <div className="text-[11px] text-tenue leading-snug mt-0.5">{p.skills[i].d}</div></div>
            : <div key={i} className="rounded-xl border border-dashed border-borde p-3 text-[12px] text-tenue">
                Ranura libre{SKILL_SLOT_VP[i]>0 && ' · vale '+SKILL_SLOT_VP[i]+' PV si no la ocupas'}</div>)}
        </div>
        {has(p,'empujar') && <Btn cls="mt-2 w-full" dis={g.usedSkill.empujar||!hum}
          on={()=>{ const t=g.players.find(q=>q!==p && q.pos!==null && p.pos!==null && ortho(p.pos).includes(q.pos));
            if(t) run('skillPush',{targetId:t.id, dir:Object.keys(DIRS).find(k=>step(p.pos,k)===t.pos)}); }}>
          Dar un codazo al vecino</Btn>}

        <h4 className="disp font-bold text-[13px] mt-4 mb-2">Colección · {p.scored.length}</h4>
        <div className="flex flex-wrap gap-1.5">
          {p.scored.length===0 && <span className="text-[12px] text-tenue">Sin dinosaurios puntuados todavía.</span>}
          {p.scored.map((d,i)=>
            <span key={i} className="flex items-center gap-1.5 text-[11px] px-2 py-1 rounded-lg"
              style={{color:ERA_COL[eraDe(d)], background:ERA_COL[eraDe(d)]+'1A', border:'1px solid '+ERA_COL[eraDe(d)]+'55'}}>
              <Silueta d={d} s={16}/>{d.name}</span>)}
        </div>
      </Hoja>);
  }

  if(hoja==='marcador'){
    const cuenta = q => { const c={}; CHAR_KEYS.forEach(k=>c[k]=0); q.scored.forEach(d=>d.chars.forEach(x=>c[x]++)); return c; };
    return (
      <Hoja title="Marcador" sub="Los lotes de 3 o más puntúan al final" col={col} onClose={cerrar}>
        <div className="grid gap-2">
          {g.players.slice().sort((a,b)=>b.vp-a.vp).map(q=>{
            const c = cuenta(q);
            return (
              <div key={q.id} className={'carta-fisica rounded-xl p-3 '+(q.id===p.id?'':'')}
                style={{border:'1px solid '+(q.id===p.id?'#FFD23F':'#2C3A3D')}}>
                <div className="flex items-center gap-2">
                  <Peon color={q.color} letra={q.name[0].toUpperCase()} s={22}/>
                  <span className="disp font-bold text-[14px] flex-1">{q.name}</span>
                  <span className="disp font-extrabold text-xl text-cinta">{q.vp}</span>
                </div>
                <div className="flex flex-wrap gap-1 mt-2">
                  {CHAR_KEYS.filter(k=>c[k]>0).map(k=>
                    <span key={k} className={'text-[10px] px-1.5 py-0.5 rounded '+(c[k]>=3?'bg-cinta text-esquisto font-medium':'bg-borde text-tenue')}>
                      {CHAR[k].es} {c[k]}</span>)}
                  {q.scored.length===0 && <span className="text-[11px] text-tenue">Sin colección</span>}
                </div>
                <p className="text-[11px] text-tenue mt-1.5">{q.plaster} yeso · {totalBones(q)} huesos · {q.tiles.length} losetas · {q.skills.length} habilidades</p>
              </div>);
          })}
        </div>
      </Hoja>);
  }

  if(hoja==='pausa') return <Pausa col={col} onClose={cerrar} verLog={()=>setHoja('log')} onRestart={onRestart}/>;

  if(hoja==='log') return (
    <Hoja title="Registro" sub="Lo que ha pasado, de lo último a lo primero" col={col} onClose={cerrar}>
      <div className="space-y-1.5">
        {g.log.slice().reverse().map((l,i)=>
          <p key={i} className={'text-[12px] leading-snug '+(l.t.startsWith('EVENTO')?'text-arcilla font-medium':l.t.startsWith('—')?'text-cinta':'text-tenue')}>{l.t}</p>)}
      </div>
    </Hoja>);
  return null;
}

function Pausa({col, onClose, verLog, onRestart}){
  const [aj,setAj] = useState({...AJUSTES});
  const cambiar = (k,v) => { AJUSTES[k]=v; setAj({...AJUSTES}); if(k==='sonido'&&v) son('turno'); };
  const [confirma,setConfirma] = useState(false);
  const [full,setFull] = useState(
    typeof document!=='undefined' && !!document.fullscreenElement);
  useEffect(()=>{
    const f = () => setFull(!!document.fullscreenElement);
    document.addEventListener('fullscreenchange', f);
    return ()=>document.removeEventListener('fullscreenchange', f);
  },[]);
  const alternar = () => {
    if(document.fullscreenElement){
      if(document.exitFullscreen) document.exitFullscreen();
    } else {
      irPantallaCompleta();
    }
  };
  const soporta = typeof document!=='undefined' &&
    !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  const Fila = ({icono, titulo, nota, accion, texto}) => (
    <button onClick={accion} disabled={!accion}
      className="w-full flex items-center gap-3 rounded-xl border border-borde p-3 text-left hover:border-tenue transition-colors disabled:opacity-40 active:scale-[.99]">
      <span className="w-10 h-10 rounded-lg bg-borde flex items-center justify-center shrink-0" style={{color:col}}>
        <Ico k={icono} s={19}/></span>
      <span className="flex-1 min-w-0">
        <span className="disp font-bold text-[14px] block">{titulo}</span>
        <span className="text-[11px] text-tenue leading-snug">{nota}</span></span>
      {texto && <span className="text-[12px] shrink-0" style={{color:col}}>{texto}</span>}
    </button>
  );
  return (
    <Hoja title="Partida en pausa" sub="Nadie juega mientras esto esté abierto" col={col} onClose={onClose}>
      <div className="grid gap-2">
        <Fila icono={full?'salir':'pantalla'}
          titulo={full?'Salir de pantalla completa':'Pantalla completa'}
          nota={soporta ? 'El tablero ocupa toda la ventana' : 'Tu navegador no lo permite aquí'}
          accion={soporta ? alternar : null}/>
        <Fila icono={aj.sonido?'sonido':'mudo'} titulo={aj.sonido?'Sonido activado':'Sonido apagado'}
          nota="Golpes de terreno, arpegios al hallar hueso y avisos de evento"
          texto={aj.sonido?'Apagar':'Activar'} accion={()=>cambiar('sonido', !aj.sonido)}/>
        <Fila icono="mov" titulo={aj.animacion?'Animaciones activadas':'Animaciones apagadas'}
          nota="Apágalas si el movimiento te molesta o si el equipo va justo"
          texto={aj.animacion?'Apagar':'Activar'} accion={()=>cambiar('animacion', !aj.animacion)}/>
        <Fila icono="pausa" titulo="Ver el registro"
          nota="Todo lo que ha pasado, de lo último a lo primero" accion={verLog}/>
      </div>
      {confirma
        ? <div className="mt-3 rounded-xl border border-arcilla/50 bg-arcilla/10 p-3">
            <p className="text-[12px] text-hueso mb-2">Se pierde la excavación en curso. ¿Seguro?</p>
            <div className="flex gap-2">
              <Btn cls="flex-1" on={()=>setConfirma(false)}>No, seguir</Btn>
              <button onClick={onRestart} className="flex-1 py-2 rounded-lg bg-arcilla text-hueso text-[13px] font-medium">Sí, abandonar</button>
            </div>
          </div>
        : <button onClick={()=>setConfirma(true)}
            className="w-full mt-3 py-2.5 rounded-xl border border-borde text-tenue text-[13px] hover:text-hueso hover:border-tenue transition-colors">
            Abandonar la partida</button>}
      <button onClick={onClose} className="btn-fisico w-full mt-3 py-3 rounded-xl disp font-bold text-[14px] active:scale-[.98] transition-transform"
        style={{background:col, color:'#0C1112'}}>Seguir excavando</button>
    </Hoja>
  );
}

const PASOS = [['durante','Durante la partida'],['lab','Dinosaurio en el laboratorio'],['ranuras','Ranuras de habilidad vacías'],
  ['habilidades','Bonos de habilidad'],['huesos','Huesos sobrantes'],['yeso','Yeso sobrante'],['cartas','Cartas de mercado'],
  ['variedad','Variedad de las nueve'],['lotes','Lotes de características'],['mayorias','Mayorías']];

function Final({g,onRestart}){
  const w = g.breakdown[0];
  const max = Math.max(...g.breakdown.map(r=>r.total),1);
  const caja = useRef(null);
  useEffect(()=>{
    const m = MOT(); if(!m || !caja.current) return;
    m.animate(caja.current.querySelectorAll('[data-e]'),
      {opacity:[0,1], transform:['translateY(18px)','translateY(0px)']},
      {delay:m.stagger(0.07), duration:.5, ease:[.2,.9,.3,1]});
    m.animate(caja.current.querySelectorAll('[data-barra]'),
      {transform:['scaleX(0)','scaleX(1)']},
      {delay:m.stagger(0.09, {startDelay:.3}), duration:.9, type:'spring', bounce:.28});
  },[]);
  return (
    <div className="min-h-[100svh] lg:h-[100svh] lg:overflow-y-auto flex items-center justify-center px-4 py-8">
      <div ref={caja} className="max-w-2xl w-full mx-auto">
        <TEX/>
        <div className="flex items-end gap-2 text-cinta/25 h-20 overflow-hidden">
          {['Tyrannosaurus rex','Triceratops','Pteranodon','Stegosaurus'].map(n=>{
            const d=DINOS.find(x=>x.name===n);
            return <span key={n} style={{color:ERA_COL[eraDe(d)], opacity:.45, filter:'drop-shadow(0 4px 6px rgba(0,0,0,.6))'}}><Silueta d={d} s={64}/></span>;})}
        </div>
        <p data-e className="text-cinta text-[13px] mt-4">Se cierra el yacimiento</p>
        <h1 data-e className="disp font-extrabold text-[38px] leading-tight mt-1"
          style={{textShadow:'0 4px 0 rgba(0,0,0,.5), 0 8px 18px rgba(0,0,0,.6)'}}>Gana {w.name}</h1>
        <p className="text-tenue text-[13px] mt-1">{w.total} puntos y {w.dinos} dinosaurios en la colección.</p>

        <div className="mt-5 grid gap-2">
          {g.breakdown.map((r,i)=>(
            <div key={i} className="flex items-center gap-3">
              <span className="w-24 text-[12px] truncate" style={{color:r.color}}>{r.name}</span>
              <div className="flex-1 h-6 bg-sedimento rounded-md overflow-hidden"
                style={{boxShadow:'inset 0 2px 4px rgba(0,0,0,.6)'}}>
                <div data-barra className="h-full rounded-md origin-left" style={{width:(100*r.total/max)+'%', background:r.color, opacity:.85}}/>
              </div>
              <span className="disp font-extrabold text-[15px] w-10 text-right">{r.total}</span>
            </div>))}
        </div>

        <details data-e className="carta-fisica mt-6 rounded-xl p-3" style={{border:'1px solid #2C3A3D'}}>
          <summary className="text-[13px] cursor-pointer">Ver el desglose de los nueve pasos</summary>
          <div className="overflow-x-auto scroll mt-3">
            <table className="w-full text-[12px] border-collapse">
              <thead><tr className="text-tenue">
                <th className={'text-left font-medium py-2 pr-3 border-b border-borde'/* taste-skill-ignore: separador de tabla real */}>Paso</th>
                {g.breakdown.map((r,i)=><th key={i} className={'text-right font-medium py-2 px-2 border-b border-borde'/* taste-skill-ignore: separador de tabla real */}><span style={{color:r.color}}>{r.name}</span></th>)}
              </tr></thead>
              <tbody>
                {PASOS.map(([k,l])=>(
                  <tr key={k}>
                    <td className={'py-1.5 pr-3 border-b border-borde/50 text-hueso/80'/* taste-skill-ignore: separador de tabla real */}>{l}</td>
                    {g.breakdown.map((r,i)=><td key={i} className={'text-right py-1.5 px-2 border-b border-borde/50 '+(r.b[k]?'text-hueso':'text-tenue/40')/* taste-skill-ignore: separador de tabla real */}>{r.b[k]}</td>)}
                  </tr>))}
                <tr><td className="py-2 pr-3 disp font-bold">Total</td>
                  {g.breakdown.map((r,i)=><td key={i} className="text-right py-2 px-2 disp font-extrabold text-cinta text-base">{r.total}</td>)}</tr>
              </tbody>
            </table>
          </div>
        </details>

        <button data-e onClick={onRestart} className="btn-fisico mt-6 w-full bg-cinta text-esquisto disp font-extrabold text-lg py-3.5 rounded-xl active:scale-[.99] transition-transform">
          Otra excavación</button>
      </div>
    </div>
  );
}

function App(){
  const [g,setG] = useState(null);
  return g ? <Game g={g} setG={setG} onRestart={()=>setG(null)}/>
           : <Setup onStart={cfg=>setG(setupGame(cfg))}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
