/* ============================================================
   RETRATOS DE DINOSAURIOS — búsqueda en segundo plano, una
   sola vez por dino en toda la sesión. Se usan como fondo
   tenue de la carta, no como imagen principal.
   ============================================================ */
const IMG_URLS = new Map();
const IMG_PROM = new Map();

function preload(url){
  return new Promise(res => {
    const im = new Image();
    im.referrerPolicy = 'no-referrer';
    im.onload = () => res(true);
    im.onerror = () => res(false);
    im.src = url;
  });
}

function buscarDino(nombre){
  if(IMG_PROM.has(nombre)) return IMG_PROM.get(nombre);
  const slug = nombre.replace(/ /g, '_');
  const urls = [
    'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(slug),
    'https://es.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(slug),
  ];
  const p = (async () => {
    for(const api of urls){
      try {
        const r = await fetch(api, { redirect:'follow' });
        if(!r.ok) continue;
        const j = await r.json();
        const url = (j && j.thumbnail && j.thumbnail.source)
                 || (j && j.originalimage && j.originalimage.source)
                 || null;
        if(!url) continue;
        const ok = await preload(url);
        if(ok){ IMG_URLS.set(nombre, url); return url; }
      } catch(e){}
    }
    IMG_URLS.set(nombre, null);
    return null;
  })();
  IMG_PROM.set(nombre, p);
  return p;
}

function irPantallaCompleta(){
  if(typeof document === 'undefined') return;
  if(document.fullscreenElement) return;
  const d = document.documentElement;
  const fn = d.requestFullscreen || d.webkitRequestFullscreen || d.msRequestFullscreen;
  if(!fn) return;
  try {
    const p = fn.call(d);
    if(p && p.catch) p.catch(()=>{});
  } catch(e){}
}
if(typeof document !== 'undefined'){
  const reintento = () => {
    irPantallaCompleta();
    document.removeEventListener('click', reintento, true);
    document.removeEventListener('touchend', reintento, true);
  };
  document.addEventListener('click', reintento, true);
  document.addEventListener('touchend', reintento, true);
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let RNG = mulberry32(1);
const ri = n => Math.floor(RNG()*n);
const shuffle = a => {const x=a.slice(); for(let i=x.length-1;i>0;i--){const j=ri(i+1);[x[i],x[j]]=[x[j],x[i]];} return x;};

const rc = i => [Math.floor(i/5), i%5];
const ix = (r,c) => (r<0||c<0||r>4||c>4) ? null : r*5+c;
const DIRS = {N:[-1,0], S:[1,0], E:[0,1], O:[0,-1]};
const DIR_ES = {N:'arriba', S:'abajo', E:'derecha', O:'izquierda'};
const step = (i,d) => {const [r,c]=rc(i); const [dr,dc]=DIRS[d]; return ix(r+dr,c+dc);};
const ortho = i => Object.keys(DIRS).map(d=>step(i,d)).filter(x=>x!==null);
const diag = i => {const[r,c]=rc(i);return [[-1,-1],[-1,1],[1,-1],[1,1]].map(([a,b])=>ix(r+a,c+b)).filter(x=>x!==null);};
const around8 = i => ortho(i).concat(diag(i));
const edgeOf = i => {const[r,c]=rc(i); if(r===0)return'N'; if(r===4)return'S'; if(c===0)return'O'; return'E';};
const cellsOnEdge = side => {const o=[];for(let k=0;k<5;k++){o.push(side==='N'?ix(0,k):side==='S'?ix(4,k):side==='O'?ix(k,0):ix(k,4));}return o;};

let TID = 0;
function makeTile(mat){
  const n = MAT[mat].nf, frags = [];
  for(let i=0;i<n;i++){
    if(mat==='stone' && i===n-1 && RNG()<0.45) frags.push('comodin');
    else frags.push(FR[ri(3)]);
  }
  return {id:'t'+(TID++), mat, frags};
}

function setupGame(cfg){
  RNG = mulberry32(cfg.seed);
  TID = 0;
  const P = cfg.players.length;
  const bag = [];
  Object.entries(BONE_BOX).forEach(([b,n])=>{for(let i=0;i<n;i++)bag.push(b);});
  for(let i=0;i<HAMMERS;i++) bag.push('martillo');
  const pits = Array.from({length:25},()=>[]);
  shuffle(bag).forEach(o => pits[ri(25)].push(o));

  const discard = FR.map(f=>{const t=makeTile('sand'); t.frags=[f]; return t;});
  let sand=[],clay=[],stone=[];
  for(let i=0;i<18;i++) sand.push(makeTile('sand'));
  for(let i=0;i<9;i++)  clay.push(makeTile('clay'));
  for(let i=0;i<8;i++)  stone.push(makeTile('stone'));

  const cells = Array.from({length:25},()=>[]);
  STONE_SPOTS.forEach(s => cells[s].push(stone.pop()));
  const soft = shuffle(sand.concat(clay));
  for(let i=0;i<25;i++) if(cells[i].length===0) cells[i].push(soft.pop());
  const top = shuffle(soft.concat(stone));
  const spots = shuffle([...Array(25).keys()].filter(i=>!CORNERS.includes(i)));
  let placed = 0;
  for(const t of top){
    if(placed>=10) break;
    const s = spots.find(s => cells[s].length===1 && !(t.mat==='stone' && cells[s][0].mat==='stone'));
    if(s===undefined) continue;
    cells[s].push(t); spots.splice(spots.indexOf(s),1); placed++;
  }

  const toolDeck = shuffle(TOOL_DESIGNS.flatMap(d=>Array.from({length:d.q},(_,i)=>({...d,uid:d.k+i}))));
  const supDeck  = shuffle(SUPPLY_DESIGNS.flatMap(d=>Array.from({length:d.q},(_,i)=>({...d,uid:d.k+i}))));
  const dinoDeck = shuffle(DINOS.slice());
  let skillPool = SKILLS.slice();
  if(!cfg.opts.agresivas) skillPool = skillPool.filter(s=>!s.agg);
  const skillRow = shuffle(skillPool).slice(0,9);

  const freeStart = shuffle(CORNERS.concat(P===5?[12]:[]));
  const players = cfg.players.map((p,i)=>({
    id:i, name:p.name, isAI:p.isAI, color:COLORS[i],
    pos:freeStart[i], fell:null,
    plaster:0, storage:{diente:0,femur:0,costilla:0,cadera:0,craneo:0},
    lab:[], scored:[], tiles:[], tools:[], supplies:[], skills:[], vp:0,
  }));

  return {
    seed:cfg.seed, opts:cfg.opts, cells, pits, players,
    turn:0, phase:'actions', energy:4, hammers:0, bought:0, usedSkill:{},
    pool: 4*P, reserve: 40 - 4*P, poolIndex:1,
    dinoDeck: dinoDeck.slice(4), dinoRow: dinoDeck.slice(0,4),
    toolDeck: toolDeck.slice(2), supDeck: supDeck.slice(2),
    market: [toolDeck[0],toolDeck[1],supDeck[0],supDeck[1]].map((c,i)=>({...c, kind:i<2?'tool':'supply'})),
    skillRow, eventDeck: shuffle(EVENTS).slice(0,3), pendingEvent:null,
    discard, log:[{t:'Montaje completo. Empieza '+players[0].name+'.'}],
    endTrigger:false, finalTurns:null, over:false, breakdown:null,
  };
}

const cur = g => g.players[g.turn];
const has = (p,k) => p.skills.some(s=>s.k===k);
const digCost = (p,mat) => mat==='clay'&&has(p,'arcilla1') ? 1 : mat==='stone'&&has(p,'piedra2') ? 2 : MAT[mat].dig;

const marketCap = p => has(p,'mercado2') ? 2 : 1;
const startEnergy = p => has(p,'energia5') ? 5 : 4;
const pawnAt = (g,i) => g.players.find(p=>p.pos===i);
const openPit = (g,i) => g.cells[i].length===0 && g.pits[i].length>0;
const pasoHacia = (a,b) => { const ra=Math.floor(a/5), ca=a%5, rb=Math.floor(b/5), cb=b%5;
  return ca===cb ? (rb===ra+1?'S':rb===ra-1?'N':null) : ra===rb ? (cb===ca+1?'E':cb===ca-1?'O':null) : null; };

function digTargets(g,p){
  if(p.pos===null) return [];
  const list = [p.pos, ...ortho(p.pos)];
  if(has(p,'diagCav')) list.push(...diag(p.pos));
  return list.filter(i=>g.cells[i].length>0);
}
function extractTargets(g,p){
  if(p.pos===null) return [];
  const list = has(p,'diagExt') ? around8(p.pos) : ortho(p.pos);
  return list.filter(i=>openPit(g,i));
}
function moveTargets(g,p){
  if(p.pos===null) return [];
  const max = has(p,'mover3') ? 3 : 2;
  const seen = {[p.pos]:0}, out = new Set(), q=[p.pos];
  while(q.length){
    const i = q.shift();
    if(seen[i]>=max) continue;
    for(const j of around8(i)){
      if(g.cells[j].length===0) continue;
      if(seen[j]!==undefined && seen[j]<=seen[i]+1) continue;
      seen[j]=seen[i]+1; q.push(j);
      if(!pawnAt(g,j)) out.add(j);
    }
  }
  out.delete(p.pos);
  return [...out];
}
function sandTargets(g,p){
  if(!g.discard.some(t=>t.mat==='sand')) return [];
  const base = p.pos===null ? cellsOnEdge(p.fell) : ortho(p.pos);
  return base.filter(i=>g.cells[i].length<2);
}
function climbTargets(g,p){
  if(p.pos!==null) return [];
  const libre = i => g.cells[i].length>0 && !pawnAt(g,i);
  const propio = cellsOnEdge(p.fell).filter(libre);
  if(propio.length) return propio;
  return ['N','S','E','O'].flatMap(cellsOnEdge).filter((i,k,a)=>a.indexOf(i)===k).filter(libre);
}

function planSlide(cells, from, dir, weight){
  const to = step(from, dir);
  if(to===null) return {ok:true, ops:[{type:'fall', from}]};
  const ops = [];
  if(cells[to].length===2){
    const top = cells[to][1];
    if(MAT[top.mat].w > weight) return {ok:false, ops:[]};
    const sub = planSlide(cells, to, dir, weight);
    if(!sub.ok) return {ok:false, ops:[]};
    ops.push(...sub.ops);
  }
  ops.push({type:'move', from, to});
  return {ok:true, ops};
}
function planDig(g, from, dir){
  if(g.cells[from].length===0) return {ok:false, ops:[]};
  const top = g.cells[from][g.cells[from].length-1];
  return planSlide(g.cells, from, dir, MAT[top.mat].w);
}
function pushPawn(g, p, dir, log){
  const to = step(p.pos, dir);
  if(to===null){ p.fell = edgeOf(p.pos); p.pos=null; log.push(p.name+' sale del yacimiento por el lado '+DIR_ES[dir]+'.'); return; }
  if(g.cells[to].length===0){ p.fell = edgeOf(to); p.pos=null; log.push(p.name+' cae en una fosa y queda fuera.'); return; }
  const other = g.players.find(q=>q!==p && q.pos===to);
  if(other) pushPawn(g, other, dir, log);
  p.pos = to;
}
function applyOps(g, ops, dir, actor, log){
  for(const op of ops){
    const rider = g.players.find(p=>p.pos===op.from);
    if(op.type==='fall'){
      const t = g.cells[op.from].pop();
      actor.tiles.push(t);
      log.push(actor.name+' reclama una loseta de '+MAT[t.mat].es.toLowerCase()+'.');
      if(rider){ rider.fell = edgeOf(op.from); rider.pos=null; log.push(rider.name+' cae fuera con la loseta.'); }
    } else {
      const victim = g.players.find(p=>p.pos===op.to && p!==rider);
      if(victim) pushPawn(g, victim, dir, log);
      g.cells[op.to].push(g.cells[op.from].pop());
      if(rider) rider.pos = op.to;
    }
  }
}

function applyTile(t, need){
  for(const f of t.frags){
    if(f!=='comodin' && need[f]>0){ need[f]--; continue; }
    if(f==='comodin'){ const s=FR.find(x=>need[x]>0); if(s){need[s]--;continue;} }
    if(need.comodin>0) need.comodin--;
  }
}
function solvePayment(tiles, cost){
  const need = {ambar:0,huevo:0,huella:0,comodin:0,...cost};
  const used = new Set();
  const pick = score => {
    let best=null;
    tiles.forEach((t,i)=>{ if(used.has(i))return; const s=score(t); if(s>0&&(!best||s>best.s||(s===best.s&&t.frags.length<tiles[best.i].frags.length))) best={i,s}; });
    return best;
  };
  for(const f of FR){
    let guard=0;
    while(need[f]>0 && guard++<40){
      const b = pick(t=>t.frags.filter(x=>x===f||x==='comodin').length);
      if(!b) return null;
      used.add(b.i); applyTile(tiles[b.i], need);
    }
  }
  let guard=0;
  while(need.comodin>0 && guard++<40){
    const b = pick(t=>t.frags.length);
    if(!b) return null;
    used.add(b.i); applyTile(tiles[b.i], need);
  }
  return [...used];
}
const Coste = ({c, s=13}) => {
  const ks = FR.concat('comodin').filter(k=>c[k]);
  if(!ks.length) return <span className="text-tenue">—</span>;
  return <span className="inline-flex items-center gap-1.5">{ks.map(k=><span key={k} className="inline-flex items-center gap-0.5">{c[k]}<FragIc f={k} s={s}/></span>)}</span>;
};

function gainPlaster(g, p, n, log){
  for(let i=0;i<n;i++){
    if(g.pool>0){ g.pool--; p.plaster++; if(g.pool===0) g.pendingEvent = g.pendingEvent || 'due'; }
    else if(g.reserve>0){ g.reserve--; p.plaster++; }
  }
  if(log) log.push(p.name+' gana '+n+' yeso'+(n>1?'s':'')+'.');
}
function resolveEvent(g, log){
  const ev = g.eventDeck.shift() || EVENTS[ri(EVENTS.length)];
  const actor = cur(g);
  log.push('EVENTO — '+ev.n+': '+ev.d);
  const ef = [];
  const lista = a => a.map(p=>p.name).join(', ');
  g.lastEvent = {n:ev.n, d:ev.d, efectos:ef, id:(g.lastEvent?g.lastEvent.id:0)+1};
  switch(ev.k){
    case 'derrumbe': {
      const heavy = g.discard.slice().sort((a,b)=>MAT[b.mat].w-MAT[a.mat].w).slice(0,2);
      heavy.forEach(t=>{
        const spots = [...Array(25).keys()].filter(i=>g.cells[i].length<2 && !(t.mat==='stone'&&g.cells[i][0]&&g.cells[i][0].mat==='stone'&&g.cells[i].length===1));
        if(!spots.length) return;
        const s = spots[ri(spots.length)];
        g.cells[s].push(t); g.discard.splice(g.discard.indexOf(t),1);
      });
      ef.push(heavy.length ? 'Caen '+heavy.length+' loseta'+(heavy.length===1?'':'s')+' sobre el yacimiento.' : 'No había losetas en el descarte.');
      break; }
    case 'suministro': { const dio=[]; g.players.forEach(p=>{let k=0; for(let i=0;i<2;i++){if(g.reserve>0){g.reserve--;p.plaster++;k++;}} if(k)dio.push(p.name+' +'+k);});
      ef.push(dio.length?dio.join(' · '):'La reserva estaba vacía: nadie recibe yeso.'); break; }
    case 'subvencion': { const max=Math.max(...g.players.map(p=>p.vp));
      const lider=g.players.filter(p=>p.vp===max), gana=g.players.filter(p=>p.vp<max);
      gana.forEach(p=>p.vp+=3);
      ef.push(gana.length ? 'Lidera '+lista(lider)+'. Ganan 3 PV: '+lista(gana)+'.' : 'Todos empatados: nadie cobra.');
      break; }
    case 'viento': g.market = g.market.map(c => drawMarket(g, c.kind));
      ef.push('Mercado nuevo: '+g.market.map(c=>c.n).join(', ')+'.'); break;
    case 'relevo': { const dio=[]; g.players.forEach(p=>{ if(g.toolDeck.length){ const c={...g.toolDeck.shift(),kind:'tool'}; p.tools.push({card:c,used:false}); dio.push(p.name+': '+c.n); } });
      ef.push(dio.length?dio.join(' · '):'El mazo de herramientas está agotado.'); break; }
    case 'hallazgo': { if(g.dinoDeck.length){ const k=ri(4); const fuera=g.dinoRow[k]; g.dinoRow[k]=g.dinoDeck.shift();
        ef.push('Se marcha '+(fuera?fuera.name:'una carta')+'. Llega '+g.dinoRow[k].name+'.');
      } else ef.push('El mazo de dinosaurios está agotado.'); break; }
    case 'jornada': { let k=0; for(let i=0;i<3;i++){if(g.reserve>0){g.reserve--;actor.plaster++;k++;}} actor.vp+=2;
      ef.push(actor.name+' disparó el evento: +'+k+' yeso'+(k===1?'':'s')+' y +2 PV.'); break; }
    case 'inspeccion': { const multa=g.players.filter(p=>p.plaster>=6);
      multa.forEach(p=>{p.plaster-=2; g.reserve+=2;});
      ef.push(multa.length ? 'Devuelven 2 yesos: '+lista(multa)+'.' : 'Nadie acumulaba 6 o más yesos.'); break; }
    case 'temblor': { const vuelven=[]; g.players.forEach(p=>{ if(p.pos===null){ const t=climbTargets(g,p); if(t.length){ p.pos=t[ri(t.length)]; p.fell=null; vuelven.push(p.name); } } });
      ef.push(vuelven.length ? 'Vuelven al yacimiento: '+vuelven.join(', ')+'.' : 'Nadie estaba fuera del yacimiento.'); break; }
    case 'prensa': { const tot=p=>Object.values(p.storage).reduce((a,b)=>a+b,0);
      const m=Math.max(...g.players.map(tot)); const w=g.players.filter(p=>tot(p)===m);
      if(m===0) ef.push('Nadie guarda huesos todavía.');
      else if(w.length===1){ w[0].vp+=4; ef.push(w[0].name+' lidera con '+m+' huesos y gana 4 PV.'); }
      else ef.push('Empate a '+m+' huesos entre '+lista(w)+'. La mayoría empatada no cobra.');
      break; }
  }
  g.poolIndex++;
  if(g.poolIndex>4){ g.endTrigger = true; log.push('Se ha agotado el cuarto depósito. Última ronda.'); }
  else {
    const n = 4*g.players.length; const take = Math.min(n, g.reserve);
    g.reserve-=take; g.pool=take;
    log.push('Depósito '+g.poolIndex+' de 4 repuesto con '+take+' yesos.');
  }
  g.pendingEvent = null;
  if(!g.endTrigger && g.pool===0) g.pendingEvent = 'due';
}
function drawMarket(g, kind){
  const d = kind==='tool' ? g.toolDeck : g.supDeck;
  if(!d.length) return {k:'vacio', n:'—', cost:{}, kind, d:'Mazo agotado.', vp:0};
  return {...d.shift(), kind};
}

const clone = g => structuredClone(g);
const totalBones = p => Object.values(p.storage).reduce((a,b)=>a+b,0);

function act(g0, type, pl={}){
  const g = clone(g0);
  const p = cur(g);
  const L = [];
  g.fx = null; g.fxId = (g0.fxId||0) + 1;
  const spend = n => { g.energy -= n; };

  switch(type){
    case 'plaster': if(g.energy<1) break; spend(1); gainPlaster(g,p,1,L); break;
    case 'skillPlaster':
      if(g.energy<1 || g.usedSkill.yeso2) break;
      spend(1); g.usedSkill.yeso2 = true; gainPlaster(g,p,2,L); break;
    case 'move': if(g.energy<1) break; spend(1); p.pos = pl.to; L.push(p.name+' se mueve.'); break;
    case 'climb': if(g.energy<1) break; spend(1); p.pos = pl.to; p.fell=null; L.push(p.name+' sube al yacimiento.'); break;
    case 'sand': {
      const c = has(p,'arenaFree') ? 0 : 1;
      if(g.energy<c) break;
      const k = g.discard.findIndex(t=>t.mat==='sand'); if(k<0) break;
      spend(c); g.cells[pl.to].push(g.discard.splice(k,1)[0]);
      L.push(p.name+' coloca una loseta de arena.'); break; }
    case 'dig': {
      const top = g.cells[pl.from][g.cells[pl.from].length-1];
      const cost = digCost(p, top.mat);
      if(g.energy<cost) break;
      const plan = planDig(g, pl.from, pl.dir);
      if(!plan.ok) break;
      spend(cost);
      L.push(p.name+' cava '+MAT[top.mat].es.toLowerCase()+' hacia '+DIR_ES[pl.dir]+'.');
      const antes = g.cells.map(s=>s.length ? s[s.length-1].mat : null);
      applyOps(g, plan.ops, pl.dir, p, L);
      g.fx = {k:'dig', dir:pl.dir, cells: plan.ops.filter(o=>o.type==='move').map(o=>o.to),
              caidas: plan.ops.filter(o=>o.type==='fall').map(o=>({i:o.from, mat:antes[o.from]}))};
      break; }
    case 'extract': {
      if(g.energy<1) break;
      const item = pl.item;
      const k = g.pits[pl.cell].indexOf(item); if(k<0) break;
      if(item==='martillo'){
        const cap = has(p,'martillo2') ? 2 : 1;
        if(g.hammers>=cap || !g.skillRow.length) break;
        spend(1); g.hammers++; g.pits[pl.cell].splice(k,1);
        const s = g.skillRow.splice(pl.skillIndex ?? 0,1)[0];
        p.skills.push(s);
        g.fx = {k:'extract', cell:pl.cell, item:'martillo'};
        L.push(p.name+' cambia un martillo por la habilidad «'+s.n+'».');
      } else {
        const cost = bonePlaster(p,item);
        if(p.plaster<cost) break;
        spend(1); p.plaster-=cost; g.reserve+=cost;
        g.pits[pl.cell].splice(k,1); p.storage[item]++;
        g.fx = {k:'extract', cell:pl.cell, item};
        L.push(p.name+' extrae '+BONE[item].es.toLowerCase()+' por '+cost+' yeso'+(cost>1?'s':'')+'.');
      }
      break; }
    case 'assign': {
      const d = p.lab[pl.labIndex]; if(!d) break;
      const need = d.bones.slice(); d.assigned.forEach(b=>{const i=need.indexOf(b); if(i>=0)need.splice(i,1);});
      if(!need.includes(pl.bone) || p.storage[pl.bone]<1) break;
      p.storage[pl.bone]--; d.assigned.push(pl.bone);
      L.push(p.name+' asigna '+BONE[pl.bone].es.toLowerCase()+' a '+d.name+'.'); break; }
    case 'scoreLab': {
      const d = p.lab[pl.labIndex]; if(!d) break;
      const perfect = d.assigned.length===d.bones.length;
      const pts = perfect ? d.perfect : d.assigned.reduce((a,b)=>a+BONE[b].val,0);
      p.vp += pts; p.lab.splice(pl.labIndex,1); p.scored.push(d);
      L.push(p.name+' puntúa '+d.name+(perfect?' al completo':' de forma parcial')+': '+pts+' PV.');
      if(perfect){
        if(has(p,'bonoPerf')){ p.vp+=3; L.push('Prensa especializada: +3 PV.'); }
        if(has(p,'herrPerf') && g.toolDeck.length){ p.tools.push({card:{...g.toolDeck.shift(),kind:'tool'},used:false}); L.push('Reconocimiento: roba una herramienta.'); }
      }
      break; }
    case 'scoreRow': {
      const d = g.dinoRow[pl.rowIndex]; if(!d) break;
      const need = {}; d.bones.forEach(b=>need[b]=(need[b]||0)+1);
      if(!Object.entries(need).every(([b,n])=>p.storage[b]>=n)) break;
      Object.entries(need).forEach(([b,n])=>{p.storage[b]-=n;});
      p.vp += d.perfect; p.scored.push({...d, assigned:d.bones.slice()});
      g.dinoRow[pl.rowIndex] = g.dinoDeck.shift() || null;
      L.push(p.name+' puntúa '+d.name+' directamente del expositor: '+d.perfect+' PV.');
      if(has(p,'bonoPerf')) { p.vp+=3; L.push('Prensa especializada: +3 PV.'); }
      if(has(p,'herrPerf') && g.toolDeck.length){ p.tools.push({card:{...g.toolDeck.shift(),kind:'tool'},used:false}); }
      break; }
    case 'buy': {
      if(g.bought >= marketCap(p)) break;
      const card = g.market[pl.marketIndex]; if(!card || card.k==='vacio') break;
      const use = solvePayment(p.tiles, card.cost); if(!use) break;
      use.sort((a,b)=>b-a).forEach(i=>{ g.discard.push(p.tiles.splice(i,1)[0]); });
      g.bought++;
      if(card.kind==='tool'){ p.tools.push({card, used:false}); L.push(p.name+' compra la herramienta '+card.n+'.'); }
      else {
        p.supplies.push(card);
        if(card.gain.plaster) gainPlaster(g,p,card.gain.plaster,null);
        if(card.gain.bone) p.storage[card.gain.bone]++;
        L.push(p.name+' compra el suministro '+card.n+'.');
      }
      g.market[pl.marketIndex] = drawMarket(g, card.kind);
      break; }
    case 'claim': {
      if(p.lab.length >= labCap(p)) break;
      const d = g.dinoRow[pl.rowIndex]; if(!d) break;
      if(!d.bones.includes(pl.bone) || p.storage[pl.bone]<1) break;
      p.storage[pl.bone]--;
      p.lab.push({...d, assigned:[pl.bone]});
      g.dinoRow[pl.rowIndex] = g.dinoDeck.shift() || null;
      L.push(p.name+' lleva '+d.name+' a su laboratorio.');
      break; }
    case 'tool': {
      const slot = p.tools[pl.toolIndex]; if(!slot || slot.used) break;
      const e = slot.card.eff;
      if(e.t==='energy'){ g.energy += e.n; }
      if(e.t==='move'){ p.pos = pl.to; }
      if(e.t==='slide' || e.t==='removeTop' || e.t==='remove'){
        if(e.t==='slide'){
          let from = pl.from;
          for(let s=0;s<(e.dist||1);s++){
            const plan = planSlide(g.cells, from, pl.dir, MAT[g.cells[from][g.cells[from].length-1].mat].w);
            if(!plan.ok) break;
            applyOps(g, plan.ops, pl.dir, p, L);
            const nx = step(from, pl.dir); if(nx===null) break; from = nx;
          }
        } else {
          const t = g.cells[pl.from].pop(); if(t) p.tiles.push(t);
          const rider = g.players.find(q=>q.pos===pl.from && g.cells[pl.from].length===0);
          if(rider){ rider.fell = edgeOf(pl.from); rider.pos=null; L.push(rider.name+' queda fuera del yacimiento.'); }
        }
      }
      if(e.t==='lantern'){ const k=g.discard.findIndex(t=>t.id===pl.tileId); if(k>=0) g.cells[pl.to].push(g.discard.splice(k,1)[0]); }
      if(e.t!=='lantern' || pl.last) slot.used = true;
      L.push(p.name+' usa '+slot.card.n+'.');
      break; }
    case 'skillPush': {
      if(g.usedSkill.empujar) break;
      const t = g.players.find(q=>q.id===pl.targetId); if(!t || t.pos===null) break;
      g.usedSkill.empujar = true;
      pushPawn(g,t,pl.dir,L); if(t.pos!==null) pushPawn(g,t,pl.dir,L);
      break; }
    case 'phase': g.phase = pl.to; break;
    case 'endTurn': return endTurn(g, L);
  }
  g.log = g.log.concat(L.map(t=>({t})));
  return g;
}

function endTurn(g, L=[]){
  let guard=0;
  while(g.pendingEvent && guard++<6) resolveEvent(g, L);
  if(g.endTrigger && g.remaining===undefined){
    g.remaining = (g.players.length-1-g.turn) + g.players.length;
    L.push('Se juega el resto de la ronda y una ronda final.');
  }
  if(g.remaining!==undefined){
    g.remaining--;
    if(g.remaining<=0){ g.over=true; g.breakdown = finalScoring(g); g.log=g.log.concat(L.map(t=>({t}))); return g; }
  }
  g.turn = (g.turn+1) % g.players.length;
  const np = cur(g);
  g.phase='actions'; g.energy = startEnergy(np); g.hammers=0; g.bought=0; g.usedSkill={};
  L.push('— Turno de '+np.name+' —');
  g.log = g.log.concat(L.map(t=>({t})));
  return g;
}

function finalScoring(g){
  const o = g.opts;
  const rows = g.players.map(p=>{
    const b = {durante:p.vp, lab:0, ranuras:0, habilidades:0, huesos:0, yeso:0, cartas:0, variedad:0, lotes:0, mayorias:0};
    p.lab.forEach(d=>{
      const need = d.bones.slice(); d.assigned.forEach(x=>{const i=need.indexOf(x); if(i>=0)need.splice(i,1);});
      need.slice().forEach(x=>{ if(p.storage[x]>0){ p.storage[x]--; d.assigned.push(x); } });
      const perfect = d.assigned.length===d.bones.length;
      b.lab += perfect ? d.perfect : d.assigned.reduce((a,x)=>a+BONE[x].val,0);
      p.scored.push(d);
    });
    p.lab = [];
    for(let s=p.skills.length; s<3; s++) b.ranuras += SKILL_SLOT_VP[s];
    const endVal = k => has(p,'diente5')&&k==='diente' ? 5 : has(p,'femur5')&&k==='femur' ? 5 : has(p,'costilla5')&&k==='costilla' ? 6 : BONE[k].end;
    Object.entries(p.storage).forEach(([k,n])=>{ b.huesos += n*endVal(k); });
    b.yeso = Math.floor(p.plaster/2);
    b.cartas = p.tools.reduce((a,t)=>a+(t.card.vp||0),0) + p.supplies.reduce((a,c)=>a+(c.vp||0),0);
    const counts = {}; CHAR_KEYS.forEach(k=>counts[k]=0);
    p.scored.forEach(d=>d.chars.forEach(c=>counts[c]++));
    if(o.lotes){
      if(CHAR_KEYS.every(k=>counts[k]>0)) b.variedad = 12;
      CHAR_KEYS.forEach(k=>{ if(counts[k]>=3) b.lotes += CHAR[k].set; });
    }
    return {p, b, counts};
  });
  if(o.mayorias) CHAR_KEYS.forEach(k=>{
    const m = Math.max(...rows.map(r=>r.counts[k]));
    if(m<=0) return;
    const w = rows.filter(r=>r.counts[k]===m);
    if(w.length===1) w[0].b.mayorias += 3;
  });
  rows.forEach(r=>{ r.total = Object.values(r.b).reduce((a,x)=>a+x,0); r.p.vp = r.total; });
  rows.sort((a,b)=> b.total-a.total || b.p.scored.length-a.p.scored.length);
  return rows.map(r=>({name:r.p.name, color:r.p.color, b:r.b, total:r.total, dinos:r.p.scored.length}));
}

function boneUtility(g,p,b){
  if(b==='martillo') return 3;
  let u = BONE[b].end/6;
  p.lab.forEach(d=>{ const need=d.bones.slice(); d.assigned.forEach(x=>{const i=need.indexOf(x);if(i>=0)need.splice(i,1);}); if(need.includes(b)) u+=4; });
  g.dinoRow.forEach(d=>{ if(d && d.bones.includes(b)) u+=1.2; });
  return u;
}
function aiStep(g){
  const p = cur(g);
  if(g.phase==='actions'){
    if(p.pos===null){ const c=climbTargets(g,p); if(c.length && g.energy>=1) return {t:'climb', to:c[0]}; }
    for(let i=0;i<g.dinoRow.length;i++){ const d=g.dinoRow[i]; if(!d) continue;
      const need={}; d.bones.forEach(b=>need[b]=(need[b]||0)+1);
      if(Object.entries(need).every(([b,n])=>p.storage[b]>=n)) return {t:'scoreRow', rowIndex:i}; }
    for(let i=0;i<p.lab.length;i++){ if(p.lab[i].assigned.length===p.lab[i].bones.length) return {t:'scoreLab', labIndex:i}; }
    for(let i=0;i<p.lab.length;i++){ const d=p.lab[i]; const need=d.bones.slice(); d.assigned.forEach(x=>{const k=need.indexOf(x);if(k>=0)need.splice(k,1);});
      const m=need.find(b=>p.storage[b]>0); if(m) return {t:'assign', labIndex:i, bone:m}; }
    if(g.energy<1) return {t:'phase', to:'market'};

    const ex = extractTargets(g,p);
    let best=null;
    ex.forEach(c=>g.pits[c].forEach(it=>{
      if(it==='martillo'){ const cap=has(p,'martillo2')?2:1; if(g.hammers>=cap||!g.skillRow.length) return; }
      else if(p.plaster < bonePlaster(p,it)) return;
      const u = boneUtility(g,p,it);
      if(!best||u>best.u) best={u, cell:c, item:it};
    }));
    if(best && best.u>=1.2) return {t:'extract', cell:best.cell, item:best.item, skillIndex:ri(g.skillRow.length)};

    const wants = ex.some(c=>g.pits[c].some(it=>it!=='martillo' && boneUtility(g,p,it)>=3));
    if(wants && p.plaster<6 && (g.pool>0||g.reserve>0)) return {t:'plaster'};

    const useful = [...Array(25).keys()].filter(i=>openPit(g,i) && g.pits[i].some(it=>boneUtility(g,p,it)>=2));
    const mv = moveTargets(g,p);
    if(useful.length && mv.length && !ex.length){
      const score = i => Math.min(...useful.map(u=>{const[a,b]=rc(i),[c,d]=rc(u);return Math.abs(a-c)+Math.abs(b-d);}));
      const to = mv.slice().sort((a,b)=>score(a)-score(b))[0];
      if(p.pos===null || score(to) < score(p.pos)) return {t:'move', to};
    }
    const cand=[];
    digTargets(g,p).forEach(from=>{
      const top=g.cells[from][g.cells[from].length-1];
      const cost=digCost(p,top.mat); if(cost>g.energy) return;
      Object.keys(DIRS).forEach(dir=>{
        const plan=planDig(g,from,dir); if(!plan.ok) return;
        let v = -cost*0.6;
        if(plan.ops.some(o=>o.type==='fall')) v += 2.2;
        if(g.cells[from].length===1 && g.pits[from].length) v += 1.6 + g.pits[from].length*0.35;
        if(from===p.pos) v -= 1.0;
        v += RNG()*0.4;
        cand.push({v,from,dir});
      });
    });
    if(cand.length){ cand.sort((a,b)=>b.v-a.v); const c=cand[0]; if(c.v>-0.5) return {t:'dig', from:c.from, dir:c.dir}; }
    if(g.pool>0 || (p.plaster<8 && g.reserve>0)) return {t:'plaster'};
    return {t:'phase', to:'market'};
  }
  if(g.phase==='market'){
    if(g.bought < marketCap(p)){
      const opts = g.market.map((c,i)=>({c,i})).filter(o=>o.c.k!=='vacio' && solvePayment(p.tiles,o.c.cost));
      if(opts.length){
        opts.sort((a,b)=>(Object.values(b.c.cost).reduce((x,y)=>x+y,0))-(Object.values(a.c.cost).reduce((x,y)=>x+y,0)));
        return {t:'buy', marketIndex:opts[0].i};
      }
    }
    return {t:'phase', to:'lab'};
  }
  if(g.phase==='lab'){
    if(p.lab.length < labCap(p)){
      const opts=[];
      g.dinoRow.forEach((d,i)=>{ if(!d) return; const b=d.bones.find(x=>p.storage[x]>0); if(b) opts.push({i,b,v:d.perfect/d.bones.length}); });
      if(opts.length){ opts.sort((a,b)=>b.v-a.v); return {t:'claim', rowIndex:opts[0].i, bone:opts[0].b}; }
    }
    return {t:'endTurn'};
  }
  return {t:'endTurn'};

function arquetipo(d){
  if(ARQ_NOMBRE[d.name]) return ARQ_NOMBRE[d.name];
  if(d.chars.includes('aereo')) return 'pterosaurio';
  if(d.chars.includes('acuatico')) return 'marino';
  if(d.chars.includes('bipedo')) return d.chars.includes('carnivoro') ? 'teropodo' : 'ornitopodo';
  if(d.chars.includes('herbivoro')) return 'sauropodo';
  return 'cuadrupedo';
}

const HUECOS = {
  1:[[50,50]],
  2:[[33,36],[67,64]],
  3:[[31,32],[70,38],[47,72]],
  4:[[30,29],[71,31],[28,71],[70,70]],
};
const mezcla = (a,b) => { let h=(a*73856093)^(b*19349663); h=(h^(h>>>13))>>>0; return h; };
function repartir(items, cell){
  const n = Math.min(items.length,4);
  const pos = HUECOS[n] || HUECOS[4];
  return items.slice(0,4).map((o,i)=>{
    const h = mezcla(cell+1, i+7);
    return {o, x:pos[i][0]+(h%7)-3, y:pos[i][1]+((h>>3)%7)-3, rot:((h>>6)%56)-28};
  });
}

function Chispas(x, y, o){
  if(quieto() || typeof document==='undefined') return;
  const col = o.col, n = o.n || 24;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;left:0;top:0;pointer-events:none;z-index:70';
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  cv.style.width = cv.width+'px'; cv.style.height = cv.height+'px';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  const dir = o.dir!==undefined ? o.dir : -Math.PI/2;
  const abre = o.abre!==undefined ? o.abre : Math.PI*2;
  const grav = o.grav!==undefined ? o.grav : .19;
  const [tmin,tmax] = o.tam || [2.5,6];
  const ps = Array.from({length:n}, ()=>{
    const ang = dir + (Math.random()-.5)*abre;
    const v = o.vel * (0.5+Math.random()*1.0);
    return {x, y, vx:Math.cos(ang)*v, vy:Math.sin(ang)*v, vida:1,
            s:tmin+Math.random()*(tmax-tmin), r:Math.random()*6,
            vr:(Math.random()-.5)*(o.giro||.4),
            c:col[Math.floor(Math.random()*col.length)]};
  });
  const fin = o.dura || .017;
  let t0 = null;
  const paso = t => {
    if(t0===null) t0 = t;
    const dt = Math.min((t-t0)/16.67, 3); t0 = t;
    ctx.clearRect(0,0,cv.width,cv.height);
    let vivos = 0;
    for(const q of ps){
      if(q.vida<=0) continue;
      vivos++;
      q.vy += grav*dt; q.x += q.vx*dt; q.y += q.vy*dt;
      q.vx *= (o.roce || .99); q.r += q.vr*dt; q.vida -= fin*dt;
      ctx.save(); ctx.globalAlpha = Math.max(q.vida,0);
      ctx.translate(q.x,q.y); ctx.rotate(q.r); ctx.fillStyle = q.c;
      if(o.forma==='redonda'){ ctx.beginPath(); ctx.arc(0,0,q.s/2,0,6.284); ctx.fill(); }
      else ctx.fillRect(-q.s/2, -q.s/2, q.s, q.s*(o.forma==='lasca'?2.2:1.6));
      ctx.restore();
    }
    if(vivos) requestAnimationFrame(paso); else cv.remove();
  };
  requestAnimationFrame(paso);
}

function Flotante(x, y, texto, color, grande){
  if(typeof document==='undefined') return;
  const d = document.createElement('div');
  d.textContent = texto;
  d.style.cssText = 'position:fixed;left:0;top:0;z-index:71;pointer-events:none;'+
    'font-family:Bricolage Grotesque,sans-serif;font-weight:800;white-space:nowrap;'+
    'text-shadow:0 2px 0 rgba(0,0,0,.7);font-size:'+(grande?26:16)+'px;color:'+color+';'+
    'transform:translate(-50%,-50%) translate('+x+'px,'+y+'px)';
  document.body.appendChild(d);
  if(quieto() || !d.animate){ setTimeout(()=>d.remove(), 900); return; }
  d.animate([
    {transform:'translate(-50%,-50%) translate('+x+'px,'+y+'px) scale(.5)', opacity:0},
    {transform:'translate(-50%,-50%) translate('+x+'px,'+(y-14)+'px) scale('+(grande?1.2:1.08)+')', opacity:1, offset:.22},
    {transform:'translate(-50%,-50%) translate('+x+'px,'+(y-28)+'px) scale(1)', opacity:1, offset:.62},
    {transform:'translate(-50%,-50%) translate('+x+'px,'+(y-64)+'px) scale(.92)', opacity:0}
  ], {duration:grande?1500:1100, easing:'cubic-bezier(.2,.9,.3,1)'})
   .finished.then(()=>d.remove(), ()=>d.remove());
}
const flotanteEn = (el, texto, color, grande) => {
  if(!el || !el.getBoundingClientRect) return;
  const r = el.getBoundingClientRect();
  Flotante(r.left+r.width/2, r.top+r.height/2, texto, color, grande);
};

let AC = null;
function audio(){
  if(!AJUSTES.sonido || typeof window==='undefined') return null;
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tono(f0, f1, dur, tipo, vol, retraso){
  const ac = audio(); if(!ac) return;
  const t = ac.currentTime + (retraso||0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo || 'sine';
  o.frequency.setValueAtTime(f0, t);
  if(f1 && f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t+dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .12, t+.012);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+.03);
}
function ruido(dur, vol, corte){
  const ac = audio(); if(!ac) return;
  const n = Math.max(1, Math.floor(ac.sampleRate*dur));
  const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2.2);
  const s = ac.createBufferSource(); s.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = corte || 420;
  const g = ac.createGain(); g.gain.value = vol || .28;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
const arpegio = (fs, vol, paso, tipo) => fs.forEach((f,i)=>tono(f, f, .15, tipo||'triangle', vol||.09, i*(paso||.055)));

function Hoja({title, sub, onClose, children, wide, col='#FFD23F'}){
  const panel = useRef(null), velo = useRef(null), previo = useRef(null);
  const [saliendo, setSaliendo] = useState(false);
  const conMotion = !!MOT();

  const cerrar = () => {
    const m = MOT();
    if(!m || !panel.current || saliendo) return onClose();
    setSaliendo(true);
    m.animate(velo.current, {opacity:[1,0]}, {duration:.2});
    m.animate(panel.current, {transform:['translateY(0px)','translateY(100%)']},
      {duration:.26, ease:[.4,0,1,1]}).finished.then(onClose, onClose);
  };

  useEffect(()=>{
    const m = MOT(); if(!m || !panel.current) return;
    m.animate(velo.current, {opacity:[0,1]}, {duration:.22});
    m.animate(panel.current, {transform:['translateY(100%)','translateY(0px)']}, MUELLE);
    const hijos = panel.current.querySelectorAll('.scroll > *');
    if(hijos.length) m.animate(hijos,
      {opacity:[0,1], transform:['translateY(16px)','translateY(0px)']},
      {delay:m.stagger(0.04), duration:.42, ease:[.2,.9,.3,1]});
  },[]);

  useEffect(()=>{
    previo.current = document.activeElement;
    if(panel.current) panel.current.focus();
    return ()=>{ const p = previo.current; if(p && p.focus && document.contains(p)) p.focus(); };
  },[]);

  useEffect(()=>{
    const k = e => {
      if(e.key==='Escape') return cerrar();
      if(e.key!=='Tab' || !panel.current) return;
      const f = panel.current.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
      if(!f.length) return;
      const first = f[0], last = f[f.length-1];
      if(e.shiftKey && (document.activeElement===first || document.activeElement===panel.current)){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
    };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[saliendo]);

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
      <div ref={velo} className={(conMotion?'':'velo ')+'absolute inset-0 bg-[#0A1011]/85'} onClick={cerrar}/>
      <div ref={panel} role="dialog" aria-modal="true" aria-label={title} tabIndex={-1}
        className={(conMotion?'':'hoja ')+'carta-fisica relative w-full '+(wide?'max-w-3xl':'max-w-lg')+' max-h-[88vh] flex flex-col rounded-t-2xl sm:rounded-2xl overflow-hidden outline-none'}
        style={{border:'2px solid '+col}}>
        <div className="flex items-center gap-3 px-4 py-3 shrink-0">
          <div className="min-w-0 flex-1">
            <h3 className="disp font-extrabold text-[17px] leading-tight truncate">{title}</h3>
            {sub && <p className="text-[12.5px] text-tenue leading-tight mt-0.5">{sub}</p>}
          </div>
          <button onClick={cerrar} aria-label="Cerrar"
            className="w-11 h-11 rounded-full bg-borde text-hueso hover:bg-[#3a4a4e] flex items-center justify-center text-xl leading-none shrink-0">×</button>
        </div>

function reach(g,p,max){
  if(p.pos===null) return [];
  const seen={[p.pos]:0}, out=new Set(), q=[p.pos];
  while(q.length){ const i=q.shift(); if(seen[i]>=max) continue;
    for(const j of around8(i)){
      if(g.cells[j].length===0) continue;
      if(seen[j]!==undefined && seen[j]<=seen[i]+1) continue;
      seen[j]=seen[i]+1; q.push(j); if(!pawnAt(g,j)) out.add(j);
    }}
  out.delete(p.pos); return [...out];
}

function Game({g, setG, onRestart}){
  const [sel,setSel] = useState(null);
